<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3Dプリント作品ギャラリー</title>
<!--
================================================================================
 3Dプリント作品ギャラリー　一覧と詳細の画面（GAS Webアプリ用）
================================================================================
 - 見た目と振る舞いは docs/gallery_mock.html をもとにしている。ただし第2ラウンド（docs/work-plan.md の R2・R4）で、
   リストの行の並び（タグ・状態・日付を右寄せ）と、一覧のタグを押せないただの文字にした点はモックと違う。今はこのファイルが正。
   サンプルデータは持たない。
 - 「作品を追加する」パネルの中身は guide.html（下の guide-template の中で include する）。
 - 外部ライブラリなし。フォントだけ Google Fonts（Zen Kaku Gothic New）。
 - GASとの境目は loadData / syncNow / resyncItem と、画像の取り直し（pumpThumbs）だけ。
   google.script.run.getGalleryData() / syncNow() / resyncItem(folderId) / getThumbnails(ids, large) を呼ぶ。
   ほかに、詳細の「戻る」と ?item= のリンク（第3ラウンドの M4・M7）で google.script.history と google.script.url を使う
   （決まりは「詳細の重なりと履歴」の節）。
 - 幅は3段階（第3ラウンドの M1）：1280px 以上は3列、961〜1279px は絞り込みを最初だけたたんだ3列、
   960px 以下は1列（ヘッダーと検索の行を上に固定、絞り込みは下からのシート、詳細は右から重ねる）。

 サーバーとの約束
   getGalleryData() の戻り値
   {
     syncedAt: ISO文字列 または null,  sheetUrl: スプシのURL,
     statuses: [状態の選択肢（並び順どおり）],  canSync: 同期してよい人か（false なら同期ボタンを無効化）,
     items: [{ folderId, folderName, folderUrl, date:"YYYY-MM-DD", name, author, purpose, status,
               tags:[..], note:[..], thumbUrl|null, photos:[{name,url}], files:[{name,url,downloadUrl}] }],
     issues: [{ folderId, folderName, problem, url /* Driveのフォルダ */, rowUrl /* スプシの該当行 */ }]
   }
   syncNow() / resyncItem(folderId) の戻り値は { done: boolean, message: string }。
   message はそのまま画面に出す。done=false は時間切れで途中まで、の意味。
   getThumbnails(ids /* ファイルID。1回10件まで（large なら2件まで） */, large /* 詳細の大きな画像なら true */) の戻り値は
   { ID: data URL または null }。Drive の URL で読めなかった画像（スマホ）だけ頼む。
   失敗は Error（message は日本語）。withFailureHandler で画面に出す。
================================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF1F3; --panel:#FFFFFF; --ink:#1F252B; --ink-2:#2C343C; --ink-3:#3B4550; --muted:#55606B; --faint:#6B7580;
  --line:#DDE2E6; --line-2:#EDF0F2; --chip-line:#C9D1D8; --field-line:#B9C2CA;
  --thumb:#E8EDF0; --thumb-hover:#DCE3E8; --soft:#F4F6F8; --seg:#E2E7EB;
  --accent:#1F5FA8; --accent-ink:#173F70; --accent-soft:#E3ECF7; --accent-row:#EEF4FB;
  --warn-bg:#FFF6DB; --warn-line:#E9CC6B; --warn-ink:#7A5300; --req:#A3301F;
  --st-use-bg:#F5D447; --st-use-fg:#2A2200; --st-use-bd:#D9B52B;
  --st-ref-bg:#FFFFFF; --st-ref-fg:#1F252B; --st-ref-bd:#AEB8C1;
  --st-oth-bg:#F4F6F8; --st-oth-fg:#3B4550; --st-oth-bd:#AEB8C1;
  --st-ret-bg:#DCE1E5; --st-ret-fg:#3E4852; --st-ret-bd:#C3CBD2;
}
*{box-sizing:border-box}
[hidden]{display:none !important} /* display を指定した要素でも hidden 属性で確実に隠す */
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,sans-serif}
button{font-family:inherit;color:inherit}
a{color:var(--accent)}a:hover{color:#174A84}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only,.m-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* .m-sr：960px 以下だけ見えなくする（読み上げには残す）。961px 以上では元に戻す（下の @media (min-width: 961px)） */
@media (min-width: 961px){.m-sr{position:static;width:auto;height:auto;overflow:visible;clip:auto;white-space:inherit}}

.app{height:100svh;display:flex;flex-direction:column;overflow:hidden}
.topbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-size:20px;font-weight:700}
.topbar .sub{font-size:13.5px;color:var(--muted)}
.topbar .actions{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sync-label{font-size:13px;color:var(--muted)}
.btn{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;font-size:14.5px;font-weight:500;background:var(--panel);border:1px solid var(--field-line);border-radius:8px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.btn-primary:hover{color:#fff}
.btn-small{min-height:40px;padding:0 12px;font-size:13.5px;color:var(--ink-3);border-color:var(--line)}
.btn[disabled]{opacity:.6;cursor:progress}
/* 「作品を追加する」の分割ボタン。本体で追加、右の ▾ でほかの方法と説明書のメニュー（960px 以下は ▾ を出さない） */
.add-split{position:relative;display:flex}
.add-split .split-main{border-radius:8px 0 0 8px}
.add-split .split-caret{width:40px;padding:0;justify-content:center;border-radius:0 8px 8px 0;border-left:1px solid rgba(255,255,255,.35)}
.add-split .split-caret svg{transition:transform .15s}
.add-split .split-caret[aria-expanded="true"] svg{transform:rotate(180deg)}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:20;width:340px;max-width:calc(100vw - 24px);padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(31,37,43,.18);display:flex;flex-direction:column}
.menu-item{min-height:44px;display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;font-size:14.5px;text-align:left;text-decoration:none;color:var(--ink);background:none;border:none;border-radius:8px;cursor:pointer}
.menu-item:hover,.menu-item:focus-visible{background:var(--soft);color:var(--ink)}
.menu-item:focus-visible{outline-offset:-3px}
.menu-item .mi-text{flex:1;display:flex;flex-direction:column;gap:1px}
.menu-item b{font-weight:700}
.menu-item .mi-sub{font-size:12.5px;color:var(--muted)}
.menu-item .mi-icon{flex:none;width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.menu-item svg{flex:none}
.menu-sep{height:1px;margin:6px 4px;background:var(--line-2)}
.menu-label{padding:4px 12px 2px;font-size:12px;font-weight:700;color:var(--muted)}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:8px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--soft)}

.body{flex:1;min-height:0;display:flex}
.pane{overflow-y:auto;overscroll-behavior:contain}

/* 左：絞り込み */
.filters{flex:none;width:260px;background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:20px}
.filters.closed{width:60px;padding:12px 8px;align-items:center}
.filters.closed .filters-open{display:none}
.filters:not(.closed) .filters-rail{display:none}
.filters-head{display:flex;align-items:center;justify-content:space-between}
.filters-head span{font-size:15px;font-weight:700}
.f-label{font-size:13px;font-weight:700;color:var(--muted)}
.f-group{display:flex;flex-direction:column;gap:6px}
.search{min-height:44px;width:100%;padding:0 12px;font-size:15px;font-family:inherit;border:1px solid var(--field-line);border-radius:8px;color:var(--ink);background:#fff}
.status-row{min-height:40px;width:100%;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:14.5px;text-align:left;background:transparent;border:none;border-radius:8px;cursor:pointer}
.status-row:hover{background:var(--soft)}
.status-row[aria-pressed="true"]{background:var(--accent-soft);font-weight:700}
.status-row .sw{width:12px;height:12px;border-radius:3px;border:1px solid}
.status-row .label{flex:1}
.status-row .count{font-size:13px;color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 11px;font-size:13.5px;background:#fff;border:1px solid var(--chip-line);border-radius:18px;cursor:pointer}
.chip .count{color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[aria-pressed="true"] .count{color:#DCE7F5}
.chip.dark[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.filters-open > .filters-head,.f-search{margin-bottom:20px}
.f-groups{display:flex;flex-direction:column;gap:20px}
/* 960px 以下でだけ使う部品（絞り込みのシートの見出し・下の行、検索の行のボタン、件数の行の同期時刻、
   要対応の開閉、詳細の「← 一覧」の行）。PC では出さない。
   .f-sheet は PC では箱を作らない（中の絞り込みが今までどおり絞り込み欄に並ぶ）。960px 以下ではこれがシートになる */
.m-filter-btn,.f-sheet-head,.f-sheet-foot,.m-sync,.issues-toggle,.detail-bar{display:none}
.f-sheet{display:contents}
.rail-btn{position:relative;background:var(--soft);color:var(--ink)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* 中央：一覧 */
.main{flex:1 1 0;min-width:0;padding:16px 20px 32px;display:flex;flex-direction:column;gap:14px}
/* 中身を縮めない。.list は overflow:hidden（角丸で切るため）なので min-height が 0 扱いになり、
   縮めると .main の高さに押し込まれて下が切れ、スクロールもできなくなる */
.main > *{flex-shrink:0}
.issues{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 14px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;font-size:14px}
.issues strong{font-weight:700}
.issues .issue-text{color:var(--ink-3)}
.issues .links{margin-left:auto;display:flex;gap:14px}
.linklike{padding:0;background:none;border:none;color:var(--accent);font-size:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.toolbar .count{font-size:15px;font-weight:700}
.active-chip{min-height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 8px 0 12px;font-size:13.5px;background:var(--accent-soft);color:var(--accent-ink);border:none;border-radius:16px;cursor:pointer}
.toolbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--seg);padding:3px;border-radius:8px}
.seg button{min-height:36px;padding:0 12px;font-size:13.5px;font-weight:500;background:transparent;border:none;border-radius:6px;cursor:pointer}
.seg button.icon{width:40px;padding:0;display:flex;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 2px rgba(31,37,43,.2)}

.status-badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;border:1px solid;white-space:nowrap}
/* 既知の3種（使用中・参考・引退）の色。それ以外の状態は st-other（グレーの破線枠） */
.st-use{background:var(--st-use-bg);color:var(--st-use-fg);border-color:var(--st-use-bd)}
.st-ref{background:var(--st-ref-bg);color:var(--st-ref-fg);border-color:var(--st-ref-bd)}
.st-ret{background:var(--st-ret-bg);color:var(--st-ret-fg);border-color:var(--st-ret-bd)}
.st-other{background:var(--st-oth-bg);color:var(--st-oth-fg);border-color:var(--st-oth-bd);border-style:dashed}

/* 一覧（カード・リスト）のタグはただの文字。押せず、ホバーでも変わらない（行やカード全体が1つのボタン） */
.tag{font-size:12.5px;line-height:1.4;padding:3px 9px;border-radius:12px;background:#EDF1F4;color:var(--ink-2);white-space:nowrap}
.tag.on{background:var(--accent);color:#fff}   /* いま絞り込みに使っているタグ */
/* 詳細ペインのタグは、押すとそのタグで絞り込むボタン */
.tag-btn{min-height:40px;padding:0 3px;background:none;border:none;cursor:pointer;display:inline-flex;align-items:center}
.tag-btn span{font-size:13.5px;padding:3px 10px;border-radius:14px;background:#EDF1F4;color:var(--ink-2);border:1px solid transparent}
.tag-btn:hover span{background:#D3E2F5;color:var(--accent-ink);border-color:#7FA3D3}
.tag-btn[aria-pressed="true"] span{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag-btn[aria-pressed="true"]:hover span{background:var(--accent-ink);border-color:var(--accent-ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:14px}
/* カードは全体（タグも含む）が1つのボタン。選択中は aria-current（クラス名を変えないのは、描き直しでフォーカスを戻すため） */
.card{display:flex;flex-direction:column;gap:8px;padding:10px 10px 12px;font-size:inherit;text-align:left;background:#fff;border-radius:12px;border:1px solid var(--line);cursor:pointer}
.card:hover{border-color:var(--chip-line)}
.card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.thumb{position:relative;display:flex;height:132px;align-items:center;justify-content:center;background:var(--thumb);border-radius:8px;overflow:hidden}
.card:hover .thumb{background:var(--thumb-hover)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:150px;height:112px}
.thumb .status-badge{position:absolute;top:8px;left:8px}
.card-name{font-size:15.5px;font-weight:700;line-height:1.35}
.card-purpose{font-size:13px;line-height:1.55;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:4px}
.card-date{margin-top:auto;font-size:12.5px;color:var(--faint)}

/* リスト：行は全体が1つのボタン。並びは [画像][名前・用途（伸びる）][タグ（右寄せ・折り返し）][状態][日付]。
   状態と日付は幅を決めてあるので、タグの数によらず右端の列がそろう。
   幅の判定は画面ではなく一覧の枠の幅で行う（絞り込み欄の開閉で一覧の幅が変わるため） */
.list{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;container-type:inline-size}
.row{width:100%;display:grid;grid-template-columns:64px minmax(0,1fr) auto 56px 86px;grid-template-areas:"th text tags st date";align-items:center;column-gap:14px;padding:8px 12px;font-size:inherit;text-align:left;background:transparent;border:none;border-top:1px solid var(--line-2);cursor:pointer}
.row:first-child{border-top:none}
/* .list は overflow:hidden なので、フォーカス枠は内側に描く（外側だと切れる） */
.row:focus-visible{outline-offset:-3px}
.row:hover{background:var(--soft)}
.row[aria-current="true"]{background:var(--accent-row);box-shadow:inset 3px 0 0 var(--accent)}
.row-thumb{grid-area:th;width:64px;height:48px;border-radius:6px;background:var(--thumb);overflow:hidden;display:flex;align-items:center;justify-content:center}
.row-thumb img{width:100%;height:100%;object-fit:cover}
.row-thumb svg{width:64px;height:48px}
.row-text{grid-area:text;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.row-purpose{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-tags{grid-area:tags;max-width:min(240px,30cqi);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px}
.row .status-badge{grid-area:st;width:56px;text-align:center;padding:2px 0}
.row-date{grid-area:date;font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
/* 狭いとき（スマホなど）は、タグを名前・用途の下に回し、日付を状態の下に置く */
@container (max-width: 560px){
  .row{grid-template-columns:64px minmax(0,1fr) auto;grid-template-areas:"th text st" "th tags date";row-gap:6px;column-gap:12px}
  .row .status-badge{justify-self:end}
  .row-tags{max-width:none;justify-content:flex-start}
}
.empty{background:#fff;border-radius:12px;padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.empty p{margin:0;font-size:16px;font-weight:500}

/* 右：詳細 */
.detail{flex:none;width:440px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.detail-head{position:sticky;top:0;z-index:1;background:#fff;display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line-2)}
.detail-head .date{font-size:13px;color:var(--muted)}
.detail-body{padding:20px;display:flex;flex-direction:column;gap:22px}
.detail h2{margin:0;font-size:24px;font-weight:700;line-height:1.3}
.detail .purpose{margin:0;font-size:16px;line-height:1.65;font-weight:500}
.detail .tags{display:flex;flex-wrap:wrap;column-gap:4px;margin-top:-8px}
.hero{height:220px;display:flex;align-items:center;justify-content:center;background:var(--thumb);border-radius:10px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:contain}
img[data-wait]{visibility:hidden}   /* サーバーに画像を頼んでいる間は空けておく */
.hero svg{width:280px;max-width:90%;height:200px}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:-10px}
.photos figure{margin:0;display:flex;flex-direction:column;gap:4px}
.photos .ph{width:112px;height:80px;border-radius:8px;background:#DCE2E7;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photos img{width:100%;height:100%;object-fit:cover}
.photos figcaption{font-size:12px;color:var(--muted);max-width:112px;overflow-wrap:anywhere}
.d-section{display:flex;flex-direction:column;gap:6px}
.d-section h3{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.note{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;line-height:1.7}
.fgroup{display:flex;flex-direction:column;gap:2px}
.fgroup-head{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding-bottom:2px}
.fgroup-head b{font-weight:700}
.fgroup-head span{color:var(--muted)}
.file{min-height:40px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:14px;color:var(--ink);text-decoration:none;border-radius:6px;background:var(--soft)}
.file:hover{background:#E9EDF0;color:var(--ink)}
.file .ext{font-size:11px;font-weight:700;min-width:38px;text-align:center;padding:2px 4px;border-radius:4px;background:var(--ink);color:#fff}
.file .fname{flex:1;overflow-wrap:anywhere}
.info{margin:0;display:grid;grid-template-columns:72px 1fr;gap:10px 12px;font-size:14px;align-items:start}
.info dt{color:var(--muted)}
.info dd{margin:0;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.info a{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:32px;font-weight:700}
.resync{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-top:12px;border-top:1px solid var(--line-2)}
.resync span{font-size:12.5px;color:var(--muted)}

/* 作品を追加する（右から出るパネル） */
.sheet{position:fixed;inset:0;z-index:10;display:flex;justify-content:flex-end}
.sheet[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(31,37,43,.36);border:none;cursor:default}
.sheet-panel{position:relative;width:780px;max-width:100%;height:100%;overflow-y:auto;background:#fff;box-shadow:-12px 0 32px rgba(31,37,43,.18);display:flex;flex-direction:column}
.sheet-head{position:sticky;top:0;z-index:1;flex:none;background:#fff;display:flex;flex-direction:column;gap:10px;padding:10px 16px 12px 28px;border-bottom:1px solid var(--line-2)}
.sheet-head h2{margin:0;font-size:20px;font-weight:700}
.sheet-head .icon-btn{margin-left:auto;color:var(--ink)}
.sheet-body{padding:24px 28px 48px;display:flex;flex-direction:column;gap:32px}
.sheet-body h3{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.sheet-body section{display:flex;flex-direction:column;gap:12px}
.lead{margin:0;font-size:15.5px;line-height:1.8;color:var(--ink-2)}
.hint{margin:0;font-size:14px;line-height:1.7;color:var(--ink-3)}
.small{margin:0;font-size:13px;color:var(--muted)}
.rules{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rule{display:grid;grid-template-columns:minmax(150px,190px) 44px 1fr;gap:12px;align-items:baseline;padding:11px 14px;border-top:1px solid var(--line-2);font-size:14px}
.rule:first-child{border-top:none}
.rule .n{font-weight:700;overflow-wrap:anywhere}
.req{font-size:12px;font-weight:700}
.req-must{color:var(--req)}.req-rec{color:var(--accent)}.req-opt{color:var(--muted)}
.rule .d{line-height:1.65;color:var(--ink-2)}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.code{margin:0;padding:14px 16px;background:var(--ink);color:#F1F3F5;border-radius:10px;font-size:13px;line-height:1.6;overflow-x:auto}
.keyrow{display:grid;grid-template-columns:76px 36px 1fr;gap:8px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.keyrow b{font-weight:700}
.keyrow span:last-child{color:var(--ink-2);line-height:1.6}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-2)}
.steps .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps .t{font-size:14.5px;line-height:1.7}
.steps li:last-child{border-bottom:none}
/* 1〜4 の段の見出しと、やり方ごとの枠（.way の data-way：drive＝ドライブに直接置く / fusion＝Fusion からまとめて書き出す） */
.step-no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.way{border:1px solid var(--line);border-radius:10px;padding:12px 16px 6px;display:flex;flex-direction:column;gap:6px}
.way h4{margin:0;font-size:15px;font-weight:700}
/* やり方の切り替えはパネルの見出しの下の1か所（.way-switch。見出しごと上に固定）。見せない方の枠は出さない */
.sheet-body:not([data-way="fusion"]) .way[data-way="fusion"],.sheet-body[data-way="fusion"] .way[data-way="drive"]{display:none}
.way > .hint:last-child,.way > .small:last-child{padding-bottom:8px}
.way > h4 + .hint:last-child{padding-bottom:6px}
.sheet-head-row{display:flex;align-items:center;gap:12px}
.way-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--seg);border-radius:10px}
.way-switch button{min-height:52px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:6px 14px;text-align:left;background:transparent;border:none;border-radius:7px;cursor:pointer}
.way-switch button b{font-size:14.5px;font-weight:700}
.way-switch button span{font-size:12.5px;color:var(--muted)}
.way-switch button:hover{background:rgba(255,255,255,.55)}
.way-switch button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 2px rgba(31,37,43,.2)}
.way-switch button[aria-pressed="true"] b{color:var(--accent-ink)}
/* 説明書などのリンク（links シート。fillGuideLinks が入れる） */
.guide-links{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 14px;background:var(--soft);border-radius:10px;font-size:14px}
.guide-links a,.glink{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.guide-links a{min-height:32px}
.glink{margin:0 .35em;padding:1px 8px;font-size:.9em;text-decoration:none;background:var(--accent-soft);border-radius:10px;white-space:nowrap}
.glink:hover{background:#D3E2F5}
.sheet-body code{font-family:ui-monospace,Consolas,monospace;font-size:.92em;background:var(--soft);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.ai{background:var(--soft);border-color:var(--soft);padding:14px 16px 16px;gap:10px}
.ai code{background:#fff}
.ai-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.ai-head div{display:flex;flex-direction:column;gap:6px;flex:1 1 300px}
.prompt{margin:0;padding:14px;background:#fff;border-radius:8px;font-family:inherit;font-size:13.5px;line-height:1.7;white-space:pre-wrap;max-height:260px;overflow:auto}

/* ---- 編集（詳細の「編集」・要対応を画面で直す。第6ラウンドの E）---- */
.detail-head .edit-btn{margin-left:auto}
.edit-btn svg,.ed-mode svg{flex:none}
.ed-mode{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:3px 10px;border-radius:12px}
.ed{display:flex;flex-direction:column;gap:20px}
.ed-field{display:flex;flex-direction:column;gap:6px}
.ed-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.ed-input{min-height:44px;width:100%;min-width:0;padding:0 12px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--field-line);border-radius:8px}
.ed-input[aria-invalid="true"]{border-color:var(--req);box-shadow:0 0 0 1px var(--req)}
.ed-err{font-size:12.5px;font-weight:700;color:var(--req)}
.ed-status{display:flex;flex-wrap:wrap;gap:6px}
.ed-st{min-height:40px;padding:0 16px;font-size:14px;font-weight:700;background:#fff;border:1px solid var(--chip-line);border-radius:8px;cursor:pointer}
.ed-st:hover{border-color:var(--ink-3)}
.ed-st[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.ed-st.st-use{background:var(--st-use-bg);color:var(--st-use-fg);border-color:var(--st-use-bd)}
.ed-st.st-ref{background:var(--st-ref-bg);color:var(--st-ref-fg);border-color:var(--st-ref-bd)}
.ed-st.st-ret{background:var(--st-ret-bg);color:var(--st-ret-fg);border-color:var(--st-ret-bd)}
.ed-st.st-other{background:var(--st-oth-bg);color:var(--st-oth-fg);border-color:var(--st-oth-bd)}
.ed-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:44px;padding:5px 6px;background:#fff;border:1px solid var(--field-line);border-radius:8px;cursor:text}
.ed-tags:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.ed-tag{display:inline-flex;align-items:center;gap:0;padding:0 0 0 10px;font-size:13.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:14px}
.ed-tag button{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:inherit;background:none;border:none;border-radius:50%;cursor:pointer}
.ed-tag button:hover{background:rgba(23,63,112,.12)}
.ed-tag-input{flex:1;min-width:110px;min-height:32px;padding:0 4px;font:inherit;font-size:15px;background:transparent;border:none;outline:none}
.ed-sugg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.ed-sugg:empty{display:none}
.ed-sugg button{min-height:32px;padding:0 10px;font-size:13px;background:#fff;border:1px dashed var(--chip-line);border-radius:16px;cursor:pointer}
.ed-sugg button:hover{border-style:solid;border-color:var(--accent);color:var(--accent-ink)}
.ed-notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ed-notes li{display:flex;align-items:center;gap:4px}
.ed-notes li::before{content:"・";flex:none;width:14px;color:var(--muted)}
.ed-add{align-self:flex-start}
.ed-alert{padding:10px 14px;font-size:14px;font-weight:700;line-height:1.6;color:var(--req);background:#FDECEA;border:1px solid #F3B8B0;border-radius:8px}
.ed-draft{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;font-size:14px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px}
.ed-draft span{flex:1 1 200px;font-weight:700;color:var(--warn-ink)}
.ed-files h3{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.ed-file-list,.ed-ups{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.ed-file{min-height:44px;display:flex;align-items:center;gap:10px;padding:0 2px 0 10px;font-size:14px;background:var(--soft);border-radius:6px}
.ed-file .ext{font-size:11px;font-weight:700;min-width:38px;text-align:center;padding:2px 4px;border-radius:4px;background:var(--ink);color:#fff}
.ed-file .fname{flex:1;min-width:0;overflow-wrap:anywhere}
.ed-file .small{padding-right:10px}
.ed-file.busy{opacity:.55}
.ed-up{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-height:40px;padding:4px 10px;font-size:13.5px;border:1px solid var(--line);border-radius:6px}
.ed-up .fname{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.ed-up .st{font-size:12.5px;font-weight:700;color:var(--muted)}
.ed-up.is-send .st{color:var(--accent-ink)}
.ed-up.is-done .st{color:#2E6B3A}
.ed-up.is-fail{border-color:#F3B8B0;background:#FDF4F2}
.ed-up.is-fail .st{color:var(--req)}
.ed-up .why{flex-basis:100%;font-size:12.5px;color:var(--req)}
.ed-drop{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;padding:16px;font-size:14px;color:var(--muted);text-align:center;border:2px dashed var(--chip-line);border-radius:10px}
.ed-drop.over{color:var(--accent-ink);background:var(--accent-row);border-color:var(--accent)}
.ed-drop .small{flex-basis:100%}
.ed-foot{position:sticky;bottom:0;z-index:2;margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 20px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(31,37,43,.06)}
.ed-foot .grow{flex:1 1 140px;font-size:13px;color:var(--muted)}
.ed-foot .grow.dirty{color:var(--warn-ink);font-weight:700}
.btn-danger{background:var(--req);border-color:var(--req);color:#fff;font-weight:700}
.btn-danger:hover{color:#fff}
/* ダイアログ（確かめ・要対応を直す）。<dialog> の showModal なので、後ろは触れず Esc で閉じる */
.dlg{width:min(480px,calc(100vw - 32px));max-height:calc(100svh - 48px);padding:0;color:var(--ink);background:#fff;border:none;border-radius:14px;box-shadow:0 24px 64px rgba(31,37,43,.28)}
.dlg[open]{display:flex;flex-direction:column}
.dlg::backdrop{background:rgba(31,37,43,.42)}
.dlg-wide{width:min(640px,calc(100vw - 32px))}
.dlg-head{flex:none;display:flex;align-items:center;gap:12px;padding:18px 20px 6px 24px}
.dlg-head h2{flex:1;margin:0;font-size:18px;font-weight:700;line-height:1.4}
.dlg-body{flex:1;min-height:0;overflow-y:auto;padding:8px 24px 16px;display:flex;flex-direction:column;gap:14px}
.dlg-foot{flex:none;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px 10px;padding:12px 20px 16px;border-top:1px solid var(--line-2)}
.dlg-foot .grow{flex:1 1 160px;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.dlg-list{margin:0;padding-left:20px;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.ed-problem{margin:0;display:flex;gap:8px;align-items:flex-start;padding:10px 12px;font-size:14px;line-height:1.6;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px}
.ed-problem svg{flex:none;margin-top:3px}
.ed-broken{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.ed-broken p{margin:0;font-weight:700;color:var(--req)}
.ed-broken pre{margin:0;max-height:140px;overflow:auto;padding:10px;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:6px}
.ed-broken label{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700}
.ed-broken input{width:20px;height:20px}

/* ---- 作品を追加する（画面から。第6ラウンドの A）。PC は真ん中のモーダル、960px 以下は全画面 ---- */
.addm{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:16px}
.addm-backdrop{position:absolute;inset:0;background:rgba(31,37,43,.42);border:none;cursor:default}
.addm-panel{position:relative;width:min(1560px,100%);height:min(1000px,100%);display:flex;flex-direction:column;background:#fff;border-radius:16px;box-shadow:0 24px 64px rgba(31,37,43,.28);overflow:hidden}
.addm-head{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 12px 12px 24px;border-bottom:1px solid var(--line-2)}
.addm-head h2{margin:0;font-size:20px;font-weight:700}
.addm-steps{margin:0;padding:0;list-style:none;display:flex;gap:6px;font-size:13px;color:var(--muted)}
.addm-steps li{padding:3px 10px;border-radius:12px;background:var(--soft)}
.addm-steps li[aria-current="step"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.addm-head .other-way{margin-left:auto;font-weight:500;font-size:13.5px}
.addm-head .icon-btn{color:var(--ink)}
.addm-body{flex:1;min-height:0;display:flex;flex-direction:column}
.addm-foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 20px;background:#fff;border-top:1px solid var(--line)}
.addm-foot .grow{flex:1 1 220px;font-size:13.5px;color:var(--muted)}
/* はじめ（まだファイルが無い） */
.addm-hero{flex:1;margin:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;border:2px dashed var(--chip-line);border-radius:14px}
.addm-hero .big{margin:0;font-size:19px;font-weight:700}
.addm-hero > svg{width:44px;height:44px;color:var(--accent)}
.addm-hero .btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.addm-hero ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6;color:var(--ink-3);text-align:left}
.addm-hero ul li::before{content:"・";color:var(--muted)}
/* 3列（ファイル・作品・情報）。作品が1つで仕分けるものが無ければ2列（ファイル・情報） */
.addm-cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,1fr) minmax(340px,1.15fr) minmax(420px,1.6fr)}
.addm-col{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line-2)}
.addm-col:last-child{border-right:none}
.addm-col[data-col="files"]{background:var(--soft)}
.col-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.col-head h3{margin:0;font-size:15px;font-weight:700}
.col-head .n{font-size:13px;color:var(--muted)}
.col-head .btn{margin-left:auto}
.addm-drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;font-size:13.5px;color:var(--muted);text-align:center;background:#fff;border:2px dashed var(--chip-line);border-radius:10px}
.addm-drop .btns{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.addm-zone.over{outline:3px dashed var(--accent);outline-offset:2px;background:var(--accent-row)}
.addm-hero.over{border-color:var(--accent);background:var(--accent-row)}
.fchips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.fchip{display:flex;align-items:center;gap:6px;min-height:42px;padding:3px 2px 3px 8px;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:grab}
.fchip.dragging{opacity:.4}
.fchip .ext{flex:none;min-width:36px;padding:2px 3px;font-size:10.5px;font-weight:700;text-align:center;color:#fff;background:var(--ink);border-radius:4px}
.fchip .fname{flex:1;min-width:0;line-height:1.35;overflow-wrap:anywhere}
.fchip .fname small{display:block;font-size:11.5px;color:var(--req)}
/* 上げている途中（待ち・送信中）は灰色で、送信中は光が流れる。上がったら普通の見た目。失敗は赤 */
.fchip.is-wait,.fchip.is-send{color:var(--faint);background:var(--soft);border-style:dashed}
.fchip.is-wait .ext,.fchip.is-send .ext{background:var(--chip-line)}
.fchip.is-send{background:linear-gradient(90deg,var(--soft) 0%,#E6EBEF 40%,var(--soft) 80%) 0 0 / 300% 100%;animation:upload-shimmer 1.4s linear infinite}
@keyframes upload-shimmer{from{background-position:100% 0}to{background-position:-200% 0}}
.fchip.is-fail{border-color:#F3B8B0;background:#FDF4F2}
.mini-spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--chip-line);border-top-color:var(--accent);animation:spin .9s linear infinite}
.fchip .mv{position:relative;flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:6px}
.fchip .mv:hover,.fchip .mv:focus-within{color:var(--ink);background:var(--soft)}
.fchip .mv:focus-within{outline:3px solid var(--accent)}
.fchip .mv select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.fchip .rm{width:34px;height:34px}
.fchip input[type="checkbox"]{flex:none;width:18px;height:18px;margin:0}
.role{display:inline-block;margin-left:6px;padding:0 6px;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:8px;white-space:nowrap}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px}
.bulk select,.addm-select{min-height:36px;padding:0 8px;font:inherit;font-size:13.5px;background:#fff;border:1px solid var(--field-line);border-radius:8px}
.zone-note{padding:12px;font-size:13px;color:var(--muted);text-align:center;border:2px dashed var(--line);border-radius:10px}
.gcards{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.gcard{display:flex;flex-direction:column;gap:6px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px}
.gcard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.gcard-top{display:flex;align-items:flex-start;gap:4px}
.gcard-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:6px 8px;font-size:inherit;text-align:left;background:none;border:none;border-radius:8px;cursor:pointer}
.gcard-main:hover{background:var(--soft)}
.gcard-main b{font-size:14px;overflow-wrap:anywhere}
.gcard-main .st{font-size:12.5px;font-weight:700}
.st.ok{color:#2E6B3A}.st.ng{color:var(--warn-ink)}
.gcard .fchips{padding:0 2px 2px}
.gcard .empty-note{padding:8px;font-size:12.5px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:8px}
.ed-row2{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:10px}
.fname-preview{margin:-8px 0 0;font-size:13px;line-height:1.7;color:var(--ink-3);overflow-wrap:anywhere}
.fname-preview b{padding:1px 6px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--soft);border-radius:4px}
.fname-preview .warn{color:var(--warn-ink);font-weight:700}
.imgs{display:flex;flex-direction:column;gap:6px}
.imgrow{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;padding:4px 10px;font-size:13.5px;background:var(--soft);border-radius:8px}
.imgrow .fname{flex:1 1 150px;min-width:0;overflow-wrap:anywhere}
.imgrow label{display:inline-flex;align-items:center;gap:6px;min-height:40px;cursor:pointer}
.imgrow input{width:18px;height:18px;margin:0}
/* 確認・登録 */
.addm-confirm{flex:1;min-height:0;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.ccard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 24px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.ccard h3{grid-column:1 / -1;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:15px}
.ccard h3 code{padding:2px 8px;font-family:ui-monospace,Consolas,monospace;font-size:13.5px;background:var(--soft);border-radius:6px;overflow-wrap:anywhere}
.ccard dl{margin:0;display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 10px;font-size:13.5px}
.ccard dt{color:var(--muted)}
.ccard dd{margin:0;overflow-wrap:anywhere}
.ccard ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;line-height:1.7;overflow-wrap:anywhere}
.ccard .sub{font-size:12.5px;color:var(--muted)}
.ccard .probs{grid-column:1 / -1;margin:0;padding:8px 12px;font-size:13.5px;line-height:1.7;color:var(--req);background:#FDF4F2;border-radius:8px}
.ccard .res{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:14px;font-weight:700}
.res.ok{color:#2E6B3A}.res.ng{color:var(--req)}.res.wait,.res.run{color:var(--muted)}
/* ページ全体にファイルを持ってきたとき */
.drop-veil{position:fixed;inset:0;z-index:40;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding:28px;background:rgba(31,95,168,.08);box-shadow:inset 0 0 0 4px var(--accent)}
.drop-veil span{padding:12px 20px;font-size:15px;font-weight:700;color:#fff;background:var(--accent);border-radius:12px;box-shadow:0 8px 24px rgba(31,37,43,.24)}
/* 追加の下書きがあるとき、ヘッダーの「作品を追加する」に印 */
.split-main{position:relative}
.split-main.has-draft::after{content:"";position:absolute;top:5px;left:5px;width:9px;height:9px;border-radius:50%;background:#F5D447;box-shadow:0 0 0 2px var(--ink)}

/* 移植で加えた部分：読み込み中・エラー・要対応の各行・同期メッセージ */
.sync-label.warn{color:var(--warn-ink);font-weight:700}
.sync-label.err{color:var(--req);font-weight:700}
.issues{flex-direction:column;align-items:stretch;gap:8px}
.issues-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.issues-head .linklike{margin-left:auto}
.issue-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.issue-row{display:flex;flex-wrap:wrap;align-items:center;gap:0 14px;border-top:1px solid var(--warn-line)}
.issue-row .issue-text{flex:1 1 260px;min-width:0;overflow-wrap:anywhere;padding:8px 0}
.issue-row .links{display:flex;gap:4px 14px;flex-wrap:wrap}
.issue-row .links a{min-height:36px;display:inline-flex;align-items:center;gap:5px;font-weight:700}
.empty .sub-note{margin:0;font-size:14px;color:var(--muted);font-weight:400}
.empty.err p{color:var(--req)}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--chip-line);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.resync .err{color:var(--req);font-weight:700}
.resync .warn{color:var(--warn-ink);font-weight:700}
@media (prefers-reduced-motion: reduce){.spinner,.mini-spin{animation-duration:3s}.fchip.is-send{animation:none}}
.issue-row .links .btn{min-height:36px;padding:0 10px;font-size:13px}
/* ---- 幅の段階（docs/work-plan.md の M1）----
   1280px 以上：3列（第2ラウンドのまま）。961〜1279px：3列のまま、絞り込みは最初だけたたむ（state.filtersOpen の初期値）。
   960px 以下：1列。ヘッダーと検索の行を上に固定し、絞り込みは下からのシート、詳細は右から重ねる（M2〜M6）。
   ページ全体がスクロールするので、シートや詳細を開いている間は body を止める（setScrollLock） */
@media (max-width: 960px){
  :root{--hdr-h:56px}
  .app{height:auto;overflow:visible}
  /* M2 ヘッダー：1行で上に固定。説明文は出さず、ボタンは絵だけ（名前は読み上げ用に残す） */
  .topbar{position:sticky;top:0;z-index:3;flex-wrap:nowrap;gap:8px;height:calc(var(--hdr-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
  .topbar h1{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .sub{display:none}
  .topbar .actions{flex:none;flex-wrap:nowrap;gap:6px}
  .topbar .btn{width:44px;padding:0;justify-content:center}
  .add-split .split-main{border-radius:8px}
  .add-split .split-caret,.add-split .menu{display:none}
  .body{flex-direction:column}
  .pane{overflow:visible}
  /* M3 検索の行：ヘッダーの下に固定。絞り込みの中身（.f-sheet）はボタンで下からのシートとして開く */
  .filters,.filters.closed{position:sticky;top:calc(var(--hdr-h) + env(safe-area-inset-top));z-index:2;width:auto;gap:0;align-items:stretch;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));border:none;border-bottom:1px solid var(--line)}
  .filters-head,.filters-rail{display:none}
  .filters-open,.filters.closed .filters-open{display:flex;align-items:center;gap:8px}
  .f-search{flex:1;min-width:0;margin:0}
  .search{font-size:16px}   /* 16px 未満だと、iOS が入力のときに画面を拡大する */
  .m-filter-btn{display:inline-flex;position:relative;flex:none;padding:0 14px}
  .f-sheet{display:none}
  body.fsheet-open .filters{z-index:9}   /* シートをヘッダーより上に出す（シートはこの中の position:fixed） */
  body.fsheet-open .f-sheet{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;background:var(--panel);animation:sheet-up .22s ease-out}
  .f-sheet-head{display:flex;align-items:center;gap:8px;min-height:calc(var(--hdr-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line-2)}
  .f-sheet-head h2{flex:1;margin:0;font-size:17px;font-weight:700}
  .f-sheet .f-groups{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
  .f-sheet-foot{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));border-top:1px solid var(--line);background:var(--panel)}
  .f-sheet-foot .btn-primary{flex:1;justify-content:center}
  /* M5 一覧：ギャラリーは2列（768px では4列）。件数の行に最終同期を小さく出す。要対応は1行にたたむ */
  .main{padding:12px max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));gap:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{padding:8px 8px 10px;gap:6px}
  .thumb{height:108px}
  .thumb svg{width:120px;height:90px}
  .card-name{font-size:14.5px}
  .card-purpose{font-size:12.5px}
  .m-sync{display:block;font-size:12.5px;color:var(--muted)}
  .m-sync.warn{color:var(--warn-ink);font-weight:700}
  .m-sync.err{color:var(--req);font-weight:700}
  .m-sync:empty{display:none}
  .issues{padding:0;gap:0}
  .issues-toggle{display:flex;width:100%;min-height:44px;align-items:center;gap:8px;padding:0 14px;background:none;border:none;font-size:14px;font-weight:700;color:var(--warn-ink);text-align:left;cursor:pointer}
  .issues-toggle .chev{margin-left:auto;transition:transform .15s}
  .issues.open .issues-toggle .chev{transform:rotate(90deg)}
  .issues:not(.open) .issues-head,.issues:not(.open) .issue-list{display:none}
  .issues-head{padding:0 14px 6px}
  .issue-list{padding:0 14px 8px}
  /* M4 詳細：右から全画面で重ねる。中でスクロールするので、画像の見張りの枠はこの要素（scrollRootOf） */
  .detail{display:none;width:auto;overflow-x:hidden;overflow-y:auto;border:none}
  body.detail-open .detail{position:fixed;inset:0;z-index:8;display:flex;animation:detail-in .22s ease-out}
  .detail-bar{display:flex;position:sticky;top:0;z-index:2;align-items:center;gap:4px;min-height:calc(var(--hdr-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(4px,env(safe-area-inset-left));background:#fff;border-bottom:1px solid var(--line)}
  .detail-back{flex:none;min-height:44px;display:inline-flex;align-items:center;gap:2px;padding:0 12px 0 6px;font-size:15px;font-weight:700;color:var(--accent);background:none;border:none;border-radius:8px;cursor:pointer}
  .detail-back:hover{background:var(--soft)}
  .detail-bar-name{flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .detail-head{position:static;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
  .detail-body{padding:16px max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .detail h2{font-size:21px}
  .hero{height:200px}
  .ed-foot{padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  /* 作品を追加する：全画面。スマホから追加することはまれなので専用の部品は持たず、3列を縦に積むだけ */
  .addm{padding:0}
  .addm-panel{width:100%;height:100%;border-radius:0;box-shadow:none}
  .addm-head{gap:4px 8px;padding:calc(6px + env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 6px max(16px,env(safe-area-inset-left))}
  .addm-head h2{flex:1;font-size:18px}
  .addm-steps{display:none}
  .addm-head .other-way{order:3;flex-basis:100%;margin:0}
  .addm-hero{margin:12px;padding:16px}
  .addm-cols{display:block;overflow-y:auto;overscroll-behavior:contain}
  .addm-col{overflow:visible;border-right:none;border-bottom:1px solid var(--line-2);padding:14px max(16px,env(safe-area-inset-right)) 20px max(16px,env(safe-area-inset-left))}
  .addm-foot{padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .addm-foot .grow{flex-basis:100%;font-size:12.5px}
  .addm-foot .btn{flex:1;justify-content:center}
  .addm-confirm{padding:14px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
  .ccard{grid-template-columns:minmax(0,1fr)}
  .ed-row2{grid-template-columns:minmax(0,1fr)}
  .ed-input,.ed-tag-input{font-size:16px}   /* 16px 未満だと、iOS が入力のときに画面を拡大する */
  .dlg,.dlg-wide{width:100vw;max-width:100vw;height:100svh;max-height:100svh;margin:0;border-radius:0}
  .dlg-head{padding:calc(12px + env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 4px max(16px,env(safe-area-inset-left))}
  .dlg-body{padding:8px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
  .dlg-foot{padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  /* M6 作品を追加するパネル：全幅。見出しは上に固定（.sheet-head は sticky）。表は縦積み、コードは枠の中で横スクロール */
  .sheet-panel{overscroll-behavior:contain;box-shadow:none}
  .sheet-head{min-height:calc(var(--hdr-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
  .way-switch{margin-right:max(8px,env(safe-area-inset-right))}
  .sheet-head h2{font-size:18px}
  .sheet-body{padding:16px max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));gap:28px}
  .rule{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
  .rule .d{grid-column:1 / -1}
  .meta-grid{grid-template-columns:minmax(0,1fr)}
  .code,.prompt{min-width:0;max-width:100%}
  .prompt{overflow-wrap:anywhere}
  .ai{padding:14px}
  .way{padding:12px 12px 4px}
  .sheet-head{flex-direction:column;align-items:stretch;gap:0;padding-bottom:10px}
  .sheet-head-row{min-height:var(--hdr-h)}
  .way-switch button{min-height:44px;padding:4px 10px;align-items:center;text-align:center}
  .way-switch button b{font-size:13.5px;line-height:1.35}
  .way-switch button span{display:none}   /* 狭い画面では説明の小さな文を出さない（見出しが高くなりすぎる） */
}
/* たたんだ絞り込み欄（961px 以上）に横のスクロールバーが出ないようにする（第2ラウンドからの不具合）。
   幅 60px から枠線 1px と左右の余白を引くと 43px で、44px のボタンが 1px はみ出すため。見た目はスクロールバーが消えるだけ */
@media (min-width: 961px){.filters.closed{overflow-x:hidden}}
/* 押せる場所を 44px 以上に（960px 以下と、1279px 以下のタッチ端末） */
@media (max-width: 960px), (max-width: 1279px) and (pointer: coarse){
  .chip,.status-row,.active-chip,.tag-btn,.file,.btn-small,.info a,.issue-row .links a,.issue-row .links .btn,.seg button,.ed-st,.ed-sugg button{min-height:44px}
  .ed-tag button{width:40px;height:40px}
  .seg button.icon{width:44px}
  .linklike{min-height:44px;display:inline-flex;align-items:center}
}
@keyframes detail-in{from{transform:translateX(100%)}to{transform:none}}
@keyframes sheet-up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none !important}body.detail-open .detail,body.fsheet-open .f-sheet{animation:none}}

</style>
</head>
<body>
<div class="sr-only" id="live" aria-live="polite"></div>
<div class="app">
  <header class="topbar">
    <h1>3Dプリント作品ギャラリー</h1>
    <span class="sub">研究室で作った部品の用途と元データ</span>
    <div class="actions">
      <span class="sync-label m-sr" id="sync-label" aria-live="polite"></span><!-- 960px 以下では見えなくし、件数の行（.m-sync）に同じ文を出す -->
      <button class="btn" id="btn-sync" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
        <span class="m-sr">今すぐ同期</span>
      </button>
      <!-- 「作品を追加する」：本体と ▾（ほかの追加方法と説明書のメニュー。renderAddMenu が中身を描く） -->
      <div class="add-split" id="add-split">
        <button class="btn btn-primary split-main" id="btn-add" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          <span class="m-sr">作品を追加する</span>
        </button>
        <button class="btn btn-primary split-caret" id="btn-add-menu" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="add-menu" aria-label="ほかの追加方法と説明書">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="menu" id="add-menu" role="menu" aria-label="ほかの追加方法と説明書" hidden></div>
      </div>
    </div>
  </header>

  <div class="body">
    <aside class="pane filters" id="filters" aria-label="絞り込み">
      <div class="filters-open">
        <div class="filters-head">
          <span>絞り込み</span>
          <button class="icon-btn" type="button" data-action="toggle-filters" aria-label="絞り込みを閉じる">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
        </div>
        <label class="f-group f-search">
          <span class="f-label m-sr">キーワード</span>
          <input class="search" id="search" type="search" placeholder="名前・用途・メモ" autocomplete="off">
        </label>
        <!-- 960px 以下：検索の横の「絞り込み」ボタン。押すと下の .f-sheet がシートとして開く -->
        <button class="btn m-filter-btn" id="m-filter-btn" type="button" data-action="open-filter-sheet" aria-haspopup="dialog" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
          <span>絞り込み</span><span class="badge" id="m-filter-badge" hidden></span>
        </button>
        <!-- 絞り込みの中身（renderFilters が描く）。PC では絞り込み欄にそのまま並び、960px 以下では同じ部品が
             下からの全画面シートになる（見出しと下の行は 960px 以下だけ出す）。部品を二重に持たないため -->
        <div class="f-sheet" id="f-sheet">
          <div class="f-sheet-head">
            <h2 id="f-sheet-title">絞り込み</h2>
            <button class="icon-btn" id="f-sheet-close" type="button" data-action="close-filter-sheet" aria-label="閉じる">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
            </button>
          </div>
          <div class="f-groups" id="filter-groups"></div>
          <div class="f-sheet-foot" id="f-sheet-foot"></div>
        </div>
      </div>
      <div class="filters-rail">
        <button class="icon-btn rail-btn" type="button" data-action="toggle-filters" aria-label="絞り込みを開く">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
          <span class="badge" id="rail-badge" hidden></span>
        </button>
      </div>
    </aside>

    <main class="pane main" id="main" aria-label="作品一覧"></main>

    <aside class="pane detail" id="detail" aria-label="作品の詳細"></aside>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <button class="sheet-backdrop" type="button" data-action="close-guide" aria-label="閉じる" tabindex="-1"></button>
  <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <div class="sheet-head-row">
        <h2 id="sheet-title">ドライブ・Fusion から追加する</h2>
        <button class="icon-btn" type="button" data-action="close-guide" aria-label="閉じる" id="sheet-close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
        </button>
      </div>
      <!-- やり方の切り替え（本文の .way の data-way と対応。setGuideWay）。見出しごと上に固定されるので、どこまで読んでも切り替えられる -->
      <div class="way-switch" role="group" aria-label="追加のしかた">
        <button type="button" data-guide-way="drive" aria-pressed="true"><b>ドライブに直接置く</b><span>1件ずつ。フォルダと meta.json を用意する</span></button>
        <button type="button" data-guide-way="fusion" aria-pressed="false"><b>Fusion からまとめて書き出す</b><span>スクリプトで一括。meta.json はあとで</span></button>
      </div>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>
</div>


<!-- 作品を追加する（画面から）。中身は renderAdd が描く -->
<div class="addm" id="add" hidden>
  <button class="addm-backdrop" type="button" data-action="close-add" aria-label="閉じる" tabindex="-1"></button>
  <section class="addm-panel" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <header class="addm-head">
      <h2 id="add-title">作品を追加する</h2>
      <ol class="addm-steps" id="add-steps"></ol>
      <button class="linklike other-way" type="button" data-action="open-guide" data-guide="drive">ほかの方法（ドライブ・Fusion）</button>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>

<!-- 「ドライブ・Fusion から追加する」パネルの中身は guide.html。GAS が include で差し込む -->
<template id="guide-template">
<?!= include('guide') ?>
</template>

<script>
/* ============================================================
   状態
   ============================================================ */
/* 960px 以下（1列の画面。M2〜M6）か。CSS の @media (max-width: 960px) と同じ境目 */
const narrowMq = window.matchMedia('(max-width: 960px)');
const state = {
  data: { items: [], issues: [], syncedAt: null, sheetUrl: '', links: [] },
  loading: true, loadError: '',                 // 初回の読み込み中／失敗
  q: '', status: 'all', tag: null, author: 'all',
  sort: 'new', view: 'gallery', selId: null,
  // 絞り込み欄を開いているか。1280px 未満では最初はたたむ（M1）。最初の表示のときだけで、その後は利用者の開け閉めのまま。
  // 960px 以下ではこの値は使わない（絞り込みは layer:'sheet' のシート）
  filtersOpen: window.matchMedia('(min-width: 1280px)').matches,
  layer: null,           // 開いている重なり：null・'add'（作品を追加する）・'guide'（ドライブ・Fusion から追加する）・'sheet'（960px 以下の絞り込み。M3）・'detail'（960px 以下の詳細。M4）
  add: null,             // 作品を追加する画面の中身（addState。閉じても残る）
  guideWay: 'drive',     // ドライブ・Fusion から追加するパネルで見せるやり方：'drive'（ドライブに直接置く）・'fusion'（Fusion からまとめて書き出す）
  issuesOpen: false,     // 960px 以下：要対応の帯を開いているか（M5。PC では常に開いた見た目）
  syncing: false, resyncing: null, notice: null,   // resyncing: 再同期中の folderId。notice: { text, kind: ''|'warn'|'err' }（同期ボタン横に出す）
  lastIssues: null                              // 要対応の件数（変わったときだけ読み上げる）
};

/* ============================================================
   データ取得・同期（GASとの境目はこの3関数だけ）
   ============================================================ */
const errMsg = (err) => (err && err.message) ? err.message : String(err || '不明なエラー');

function loadData(selectId) {
  google.script.run
    .withSuccessHandler((data) => {
      state.data = Object.assign({ items: [], issues: [], syncedAt: null, sheetUrl: '', links: [] }, data);
      state.loading = false; state.loadError = '';
      renderAddMenu(); fillGuideLinks();
      // 要対応から一覧に移った作品は、選択状態にして見つけやすくする
      if (selectId && state.data.items.some((it) => it.folderId === selectId)) state.selId = selectId;
      afterLoad();
    })
    .withFailureHandler((err) => {
      if (state.loading) { state.loading = false; state.loadError = errMsg(err); renderAll(); } // 初回：画面中央に出す
      else showError('一覧を読み込めませんでした：' + errMsg(err));                              // 再読み込み：古い一覧は残す
    })
    .getGalleryData();
}
/* 同期できる人か（サーバーが canSync:false を返したら無効化。未指定は true 扱い） */
const canSync = () => state.data.canSync !== false;
const NO_SYNC_TITLE = '同期にはスプシの編集権限が必要です';
const busy = () => state.syncing || !!state.resyncing;
const refreshBusy = () => { renderSync(); renderMain(); renderDetail(); };

function syncNow() {
  if (busy() || !canSync()) return;
  state.syncing = true; state.notice = null; refreshBusy();
  google.script.run
    .withSuccessHandler((res) => {
      state.syncing = false;
      // done=false は時間切れで途中まで。メッセージを目立たせ、ボタンは押せる状態に戻す
      state.notice = { text: (res && res.message) || '同期しました', kind: res && res.done === false ? 'warn' : '' };
      refreshBusy(); loadData();
    })
    .withFailureHandler((err) => { state.syncing = false; showError('同期できませんでした：' + errMsg(err)); refreshBusy(); })
    .syncNow();
}
/* この作品だけ再同期。結果は同期ボタン横のラベルに出す（選択が変わっても見える） */
function resyncItem(folderId) {
  if (busy() || !canSync()) return;
  const wasIssue = (state.data.issues || []).some((i) => i.folderId === folderId);
  state.resyncing = folderId; state.notice = null; refreshBusy();
  google.script.run
    .withSuccessHandler((res) => {
      state.resyncing = null;
      state.notice = { text: (res && res.message) || '読み直しました', kind: res && res.done === false ? 'warn' : '' };
      refreshBusy(); loadData(wasIssue ? folderId : null);
    })
    .withFailureHandler((err) => { state.resyncing = null; showError('読み直せませんでした：' + errMsg(err)); refreshBusy(); })
    .resyncItem(folderId);
}
const hasItem = (id) => !!id && state.data.items.some((it) => it.folderId === id);
/* PC（961px 以上）では、選んでいなければ最初の作品を選ぶ。960px 以下では選ばない（M4：最初の表示では詳細を開かない。
   選んだ印も付けない）。960px 以下から広げたときも、ここで最初の作品を選ぶ */
function selectFirstOnPc() {
  if (narrowMq.matches || hasItem(state.selId)) return;
  const first = sortedItems(state.data.items)[0];
  state.selId = first ? first.folderId : null;
}
function afterLoad() {
  if (state.edit && !hasItem(state.edit.id)) leaveEdit(false);
  if (!hasItem(state.selId)) {
    state.selId = null;
    if (state.layer === 'detail') closeLayer(false);   // 開いていた作品が一覧から消えた
    selectFirstOnPc();
  }
  renderAll();
  applyStartItem();
}
function showError(msg) {
  state.notice = { text: msg, kind: 'err' };
  renderSync();
}

/* ============================================================
   ユーティリティ
   ============================================================ */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dateLong = (d) => { const [y, m, dd] = String(d || '').split('-').map(Number); return y ? `${y}年${m}月${dd}日` : ''; };
const dateDot = (d) => String(d || '').replaceAll('-', '.');
const timeShort = (iso) => { if (!iso) return ''; const t = new Date(iso); return isNaN(t) ? '' : `${t.getMonth() + 1}/${t.getDate()} ${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}`; };
/* 状態の見た目：既知の3種は色つき、それ以外は st-other（グレー）。クラス名に日本語を使わない */
const ST_KEY = { '使用中': 'use', '参考': 'ref', '引退': 'ret' };
const stClass = (st) => ST_KEY[st] || 'other';
const DEFAULT_STATUSES = ['使用中', '参考', '引退'];
function statusList() {   // サーバーの statuses を使う。items にだけある状態も末尾に足す
  const list = (state.data.statuses && state.data.statuses.length ? state.data.statuses : DEFAULT_STATUSES).slice();
  state.data.items.forEach((it) => { if (it.status && !list.includes(it.status)) list.push(it.status); });
  return list;
}

/* 描き直しでフォーカスを失わないための仕組み：描き直し前に「どの要素か」を覚え、後で戻す */
function focusKey() {
  const el = document.activeElement;
  if (!el || el === document.body) return null;
  const box = el.closest('#filters, #main, #detail');
  if (!box) return null;
  const same = sameKind(box, { tag: el.tagName, cls: el.className, data: JSON.stringify({ ...el.dataset }) });
  return { box: box.id, tag: el.tagName, cls: el.className, data: JSON.stringify({ ...el.dataset }), idx: same.indexOf(el) };
}
const sameKind = (box, k) => [...box.querySelectorAll(k.tag)].filter((e) => e.className === k.cls && JSON.stringify({ ...e.dataset }) === k.data);
function restoreFocus(k) {
  if (!k) return;
  const cur = document.activeElement;
  if (cur && cur !== document.body && document.contains(cur)) return;   // 失っていなければ何もしない
  const same = sameKind(document.getElementById(k.box), k);
  const target = same[k.idx] || same[0];
  if (target) target.focus({ preventScroll: true });
}
const keepFocus = (fn) => { const k = focusKey(); fn(); restoreFocus(k); };

const extOf = (name) => String(name).split('.').pop().toLowerCase();

function fileGroups(files) {
  const groups = [
    { label: '編集用', hint: 'Fusionなどで形を直す', files: [] },
    { label: '印刷用', hint: 'スライサーに入れる', files: [] },
    { label: '画像', hint: '', files: [] },
    { label: 'そのほか', hint: '', files: [] }
  ];
  (files || []).forEach((f) => {
    const e = extOf(f.name);
    const i = ['f3d', 'step', 'stp'].includes(e) ? 0 : ['stl', '3mf'].includes(e) ? 1 : ['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(e) ? 2 : 3;
    groups[i].files.push(f);
  });
  return groups.filter((g) => g.files.length);
}

/* 画像が無い／読み込めないときの代わりのアイコン。形と色は作品ごとに決まった値（下の seedLook） */
function glyph(shape, color) {
  const c = esc(color || '#9AA4AD');
  const S = 'stroke="#1E2329" stroke-opacity="0.75" stroke-width="1.3" stroke-linejoin="round"';
  const dark = (pts, o) => `<polygon points="${pts}" fill="${c}"/><polygon points="${pts}" fill="#000" fill-opacity="${o}"/>`;
  const body = {
    ring: `<ellipse cx="60" cy="72" rx="36" ry="8" fill="#000" fill-opacity=".08"/><g ${S}><path d="M34 36V58A26 12 0 0 0 86 58V36" fill="${c}"/><path d="M34 36V58A26 12 0 0 0 86 58V36" fill="#000" fill-opacity=".24"/><ellipse cx="60" cy="36" rx="26" ry="12" fill="${c}"/><ellipse cx="60" cy="36" rx="11" ry="5" fill="#000" fill-opacity=".42"/></g>`,
    plate: `<ellipse cx="60" cy="76" rx="44" ry="8" fill="#000" fill-opacity=".08"/><g ${S}>${dark('14,50 60,72 60,80 14,58', .26)}${dark('60,72 106,50 106,58 60,80', .14)}<polygon points="14,50 60,28 106,50 60,72" fill="${c}"/><g fill="#000" fill-opacity=".42"><ellipse cx="40" cy="50" rx="6" ry="3"/><ellipse cx="80" cy="50" rx="6" ry="3"/><ellipse cx="60" cy="40" rx="6" ry="3"/><ellipse cx="60" cy="60" rx="6" ry="3"/></g></g>`,
    bracket: `<ellipse cx="62" cy="80" rx="42" ry="7" fill="#000" fill-opacity=".08"/><g ${S}>${dark('18,58 62,78 62,85 18,65', .26)}${dark('62,78 102,60 102,67 62,85', .14)}<polygon points="18,58 58,40 102,60 62,78" fill="${c}"/><polygon points="18,30 58,12 64,15 24,33" fill="${c}"/>${dark('24,33 64,15 64,43 24,61', .1)}<ellipse cx="44" cy="36" rx="4.5" ry="6" fill="#000" fill-opacity=".42"/><ellipse cx="80" cy="62" rx="5" ry="2.5" fill="#000" fill-opacity=".42"/></g>`,
    box: `<ellipse cx="60" cy="80" rx="44" ry="7" fill="#000" fill-opacity=".08"/><g ${S}>${dark('16,46 60,66 60,82 16,62', .26)}${dark('60,66 104,46 104,62 60,82', .14)}<polygon points="16,46 60,26 104,46 60,66" fill="${c}"/><polygon points="26,46 60,31 94,46 60,61" fill="#000" fill-opacity=".36"/></g>`
  };
  return `<svg viewBox="0 0 120 90" aria-hidden="true">${body[shape] || body.plate}</svg>`;
}
/* フォルダID（無ければ名前）の簡単なハッシュ（FNV-1a）から、形と色を決定的に選ぶ */
const SHAPES = ['box', 'plate', 'bracket', 'ring'];
const COLORS = ['#4F86C6', '#C9C2B4', '#E07A2E', '#5B9E6A', '#56606B', '#8E6BB8', '#D9534F', '#4A4F57'];
function seedLook(seed) {
  let h = 2166136261;
  for (const ch of String(seed || '')) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return { shape: SHAPES[h % SHAPES.length], color: COLORS[(h >>> 8) % COLORS.length] };
}
const itemSeed = (it) => it.folderId || it.folderName || it.name;
const glyphFor = (it) => { const l = seedLook(itemSeed(it)); return glyph(l.shape, l.color); };

/* ============================================================
   画像（Drive の URL で読めなければ、サーバーの getThumbnails で取り直す）
   スマホのブラウザは、GAS の iframe の中から drive.google.com の画像を読むときに Cookie を
   送らないため、画像が出ない（PC では出る）。そこで、まず今までどおり URL で読み、失敗した
   画像だけサーバーに頼む。サーバーでも取れなければアイコン。
   一度サーバーで取れた端末は、以降は URL を試さず最初からサーバーに頼む（ちらつきを減らす）。
   決まり：
   - 頼むのは、画面に見えている画像とその少し先（THUMB_MARGIN）だけ。IntersectionObserver で見張る
   - getThumbnails の同時実行は THUMB_PARALLEL 本まで。残りは順番待ち（送る前に画面から離れたら取り消す）
   - 取り込み済み・順番待ち・返事待ちのキーは頼み直さない（描き直しのたびに全件を頼まない）
   - 返ってきた data URL は Blob にして blob: の URL で表示する（1キーにつき1回だけ作る）。
     blob: の画像が表示できなければ（CSP など）、その端末では以降 data URL で表示する（useDataUrl）。
     そのため data URL の文字列も持っておく（メモリより確実さを優先）
   - 詳細の大きな画像（L）が表示できなければ（HEIC など）、一度だけ縮小画像（S）で頼み直す。
     S も表示できなければアイコン（data URL でも表示できなかったときだけ、この流れに進む）
   ============================================================ */
const failedImg = new Set();     // URL で読めなかった画像の URL
const serverImg = new Map();     // サーバーに頼んだ結果。キーは thumbKey、値は { blob, data }（blob: の URL と data URL）か null（取れなかった）
let useDataUrl = false;          // true なら blob: ではなく data URL で表示する（blob: が表示できなかった端末）
const thumbQueue = new Set();    // 頼む順番待ちのキー（画面に近い画像のもの）
const thumbSent = new Set();     // サーバーに送って返事を待っているキー
const brokenL = new Set();       // L を表示できなかったファイルID（以降は S を使う）
let thumbTimer = null;
let thumbRunning = 0;            // 実行中の getThumbnails の数
let serverFirst = false;         // true なら URL を試さず最初からサーバーに頼む
const THUMB_WAIT_MS = 50;        // 頼む画像をためる時間
const THUMB_BATCH = 10;          // 1回に頼む件数（S。Code.gs の THUMB_BATCH_MAX 以下）
const THUMB_BATCH_L = 2;         // 1回に頼む件数（L。Code.gs の THUMB_LARGE_BATCH_MAX 以下）
const THUMB_PARALLEL = 2;        // getThumbnails の同時実行数
const THUMB_MARGIN = '200px';    // 画面のこれだけ先までは、見える前に頼んでおく
/* Drive の URL（…/thumbnail?id=<ID>&sz=…）からファイルIDを取り出す */
const driveIdOf = (url) => { const m = /[?&]id=([\w-]+)/.exec(String(url || '')); return m ? m[1] : ''; };
/* 縮小画像（S）と詳細の大きな画像（L）は別に頼む。ID には : が入らない */
const thumbKey = (id, large) => id + (large ? ':L' : ':S');

/* 画像が無い・取れないときの代わり。写真は写真のアイコン、それ以外は作品ごとの形 */
function fallbackHTML(kind, seed) {
  if (kind === 'photo') return ICON.photo;
  const l = seedLook(seed);
  return glyph(l.shape, l.color);
}
/* 画像の <img>。o: { url, alt, large, kind: 'photo' か未指定, seed }
   サーバーの結果があればそれを使う。URL で読めないと分かっていれば data-wait を付けて描き、
   画面に近づいたら（watchThumbs の見張りが）サーバーに頼む */
function imgHTML(o) {
  const id = driveIdOf(o.url);
  const key = id ? thumbKey(id, !!o.large && !brokenL.has(id)) : '';
  const attrs = `alt="${esc(o.alt || '')}"${key ? ` data-key="${key}"` : ''}${o.kind ? ` data-kind="${o.kind}"` : ''} data-seed="${esc(o.seed || '')}" onerror="imgFail(this)"`;
  if (key && serverImg.has(key)) {
    const got = serverImg.get(key);
    return got ? `<img src="${esc(srcOf(got))}" ${attrs}>` : fallbackHTML(o.kind, o.seed);
  }
  if (key && (serverFirst || failedImg.has(o.url))) return `<img ${attrs} data-wait="1">`;
  if (failedImg.has(o.url)) return fallbackHTML(o.kind, o.seed);
  return `<img src="${esc(o.url)}" ${attrs} loading="lazy" referrerpolicy="no-referrer">`;
}
/* サーバーの結果の、表示に使う URL（blob: が使えない端末・作れなかったときは data URL） */
const srcOf = (got) => (useDataUrl || !got.blob ? got.data : got.blob);
/* 作品の代表画像。large は詳細の大きな画像（サーバーに頼むとき、元のファイルを返してもらう） */
const thumbHTML = (it, alt, large) => it.thumbUrl ? imgHTML({ url: it.thumbUrl, alt, large, seed: itemSeed(it) }) : glyphFor(it);
function showFallback(img) {
  unwatchImg(img);
  img.insertAdjacentHTML('afterend', fallbackHTML(img.dataset.kind, img.dataset.seed));
  img.remove();
}
/* <img> にキーの結果を入れる。null ならアイコン。まだ無ければ待つ（画面に近づいたら頼む） */
function fillImg(img, key) {
  img.dataset.key = key;
  const got = serverImg.get(key);
  if (got) { img.removeAttribute('data-wait'); unwatchImg(img); img.src = srcOf(got); return; }
  if (got === null) { showFallback(img); return; }
  img.removeAttribute('src');
  img.dataset.wait = '1';
  watchThumbs();
}
/* img の onerror。
   - Drive の URL で読めない → サーバーに頼む（その間は空けておく）
   - blob: が表示できない（CSP など）→ 以降は data URL で表示する。表示中のほかの blob: の画像も替える
   - data URL でも L が表示できない（HEIC など）→ 一度だけ S で頼み直す
   - data URL でも S が表示できない → アイコン（以降もアイコン。頼み直さない） */
function imgFail(img) {
  const src = img.getAttribute('src');
  if (!src) return;
  const key = img.dataset.key;
  const fromServer = /^(blob|data):/.test(src);
  if (!fromServer) failedImg.add(src);
  if (!key) { showFallback(img); return; }
  if (!fromServer) { fillImg(img, key); return; }
  if (src.startsWith('blob:')) {   // data URL に替えるのは各画像1回だけ（替えた後の src は data:）
    useDataUrl = true;
    document.querySelectorAll('img[data-key][src^="blob:"]').forEach((x) => {
      const got = serverImg.get(x.dataset.key);
      if (got) x.src = got.data;
    });
    if (img.getAttribute('src') === src) showFallback(img);   // 念のため（結果が見つからない）
    return;
  }
  const id = key.split(':')[0];
  if (key.endsWith(':L') && !brokenL.has(id)) {
    brokenL.add(id);
    fillImg(img, thumbKey(id, false));
    return;
  }
  const got = serverImg.get(key);
  if (got && got.data === src) { if (got.blob) URL.revokeObjectURL(got.blob); serverImg.set(key, null); }
  showFallback(img);
}

/* 画面に近いかの見張り。スクロールする枠（PC は各ペイン、960px 以下は一覧がページ・重ねた詳細はその要素）ごとに1つ。
   rootMargin は見張りの枠にしか効かないので、枠をペインにしておく。
   960px 以下の詳細は閉じている間も overflow-y:auto（display:none なだけ）なので、枠は開け閉めで変わらない。
   閉じている間は見えない扱いで頼まず、開くと（見えるようになると）頼む */
const thumbIO = new Map();       // スクロールの枠（null は画面）→ IntersectionObserver
const watchedImg = new Set();    // 見張っている <img>
const nearImg = new Set();       // 画面に近い <img>
function scrollRootOf(el) {
  const pane = el.closest('.pane');
  if (!pane) return null;
  const oy = getComputedStyle(pane).overflowY;
  return oy === 'auto' || oy === 'scroll' ? pane : null;
}
function observerFor(root) {
  if (!thumbIO.has(root)) thumbIO.set(root, new IntersectionObserver(onThumbSeen, { root, rootMargin: THUMB_MARGIN }));
  return thumbIO.get(root);
}
function unwatchImg(img) {
  if (!watchedImg.delete(img)) return;
  nearImg.delete(img);
  thumbIO.forEach((io) => io.unobserve(img));
}
/* 描き直しの後に呼ぶ。新しく描いた「待っている画像」だけを見張りに加え、消えた要素は外す */
function watchThumbs() {
  watchedImg.forEach((img) => { if (!img.isConnected) unwatchImg(img); });
  const waiting = document.querySelectorAll('img[data-wait]');
  if (!('IntersectionObserver' in window)) { waiting.forEach((img) => askServer(img.dataset.key)); return; }
  waiting.forEach((img) => {
    if (watchedImg.has(img)) return;
    watchedImg.add(img);
    observerFor(scrollRootOf(img)).observe(img);
  });
}
function onThumbSeen(entries) {
  entries.forEach((e) => {
    const img = e.target;
    if (!img.isConnected || !img.dataset.wait) { unwatchImg(img); return; }
    if (e.isIntersecting) { nearImg.add(img); askServer(img.dataset.key); return; }
    nearImg.delete(img);
    // 送る前に画面から離れたら、順番待ちから外す（同じキーの画像が他で見えていれば残す）
    const key = img.dataset.key;
    if (thumbQueue.has(key) && ![...nearImg].some((x) => x.dataset.key === key)) thumbQueue.delete(key);
  });
}
/* スマホ幅との切り替えでスクロールの枠が変わるので、見張りをやり直す */
function rewatchThumbs() {
  thumbIO.forEach((io) => io.disconnect());
  thumbIO.clear(); watchedImg.clear(); nearImg.clear();
  watchThumbs();
}

function askServer(key) {
  if (!key || thumbQueue.has(key) || thumbSent.has(key) || serverImg.has(key)) return;
  thumbQueue.add(key);
  if (!thumbTimer) thumbTimer = setTimeout(() => { thumbTimer = null; pumpThumbs(); }, THUMB_WAIT_MS);
}
/* 順番待ちの先頭と同じ大きさのものを THUMB_BATCH 件（L は THUMB_BATCH_L 件）ずつ、
   同時に THUMB_PARALLEL 本までサーバーに頼む。返事が来たら続きを送る */
function pumpThumbs() {
  while (thumbRunning < THUMB_PARALLEL && thumbQueue.size) {
    const large = thumbQueue.values().next().value.endsWith(':L');
    const keys = [...thumbQueue].filter((k) => k.endsWith(large ? ':L' : ':S')).slice(0, large ? THUMB_BATCH_L : THUMB_BATCH);
    keys.forEach((k) => { thumbQueue.delete(k); thumbSent.add(k); });
    const ids = keys.map((k) => k.split(':')[0]);
    thumbRunning++;
    const done = (res) => { thumbRunning--; gotThumbs(ids, large, res || {}); pumpThumbs(); };
    google.script.run
      .withSuccessHandler(done)
      .withFailureHandler(() => done({}))   // 失敗は「取れなかった」と同じ扱い（何度も頼まない）
      .getThumbnails(ids, large);
  }
}
/* サーバーの返事が画像の data URL（base64）か */
const isImageDataUrl = (v) => typeof v === 'string' && /^data:image\/[\w.+-]+;base64,/.test(v);
/* data URL（base64）→ blob: の URL。innerHTML に長い data URL を入れないため。作れなければ null */
function toBlobUrl(v) {
  const m = /^data:(image\/[\w.+-]+);base64,/.exec(v);
  try {
    const bin = atob(v.slice(m[0].length));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: m[1] }));
  } catch (_) {
    return null;
  }
}
/* サーバーの返事を記憶し、待っている画像に入れる。null・返事なしはアイコンにする */
function gotThumbs(ids, large, res) {
  ids.forEach((id) => {
    const key = thumbKey(id, large);
    thumbSent.delete(key);
    if (serverImg.has(key)) return;   // 同じキーの blob: を2つ作らない
    const v = res[id];
    const got = isImageDataUrl(v) ? { blob: useDataUrl ? null : toBlobUrl(v), data: v } : null;
    serverImg.set(key, got);
    if (got) serverFirst = true;
    document.querySelectorAll(`img[data-key="${key}"][data-wait]`).forEach((img) => fillImg(img, key));
  });
}

/* ============================================================
   絞り込み・並び替え
   ============================================================ */
function matches(it, skip) {
  const q = state.q.trim().toLowerCase();
  return (skip === 'status' || state.status === 'all' || it.status === state.status)
    && (skip === 'tag' || !state.tag || it.tags.includes(state.tag))
    && (skip === 'author' || state.author === 'all' || it.author === state.author)
    && (!q || [it.name, it.purpose, it.note.join(' '), it.tags.join(' ')].join(' ').toLowerCase().includes(q));
}
function sortedItems(items) {
  return items.slice().sort((a, b) => state.sort === 'name' ? a.name.localeCompare(b.name, 'ja') : String(b.date || '').localeCompare(String(a.date || '')));
}
function activeFilters() {
  const a = [];
  if (state.status !== 'all') a.push({ key: 'status', label: '状態：' + state.status, aria: '状態の絞り込みを解除' });
  if (state.tag) a.push({ key: 'tag', label: '#' + state.tag, aria: 'タグの絞り込みを解除' });
  if (state.author !== 'all') a.push({ key: 'author', label: '作った人：' + state.author, aria: '作った人の絞り込みを解除' });
  if (state.q.trim()) a.push({ key: 'q', label: '「' + state.q.trim() + '」', aria: 'キーワードを消す' });
  return a;
}
/* 一覧（カード・リスト）のタグ：ただの文字。絞り込みに使っているタグだけ色を付ける */
const tagLabels = (tags) => tags.map((t) => `<span class="tag${state.tag === t ? ' on' : ''}">#${esc(t)}</span>`).join('');
/* 詳細ペインのタグ：押すとそのタグで絞り込む（もう一度押すと解除） */
const tagButtons = (tags) => tags.map((t) => {
  const on = state.tag === t;
  return `<button class="tag-btn" type="button" data-tag="${esc(t)}" aria-pressed="${on}" aria-label="${on ? 'タグ「' + esc(t) + '」の絞り込みを解除' : 'タグ「' + esc(t) + '」で絞り込む'}"><span>#${esc(t)}</span></button>`;
}).join('');
