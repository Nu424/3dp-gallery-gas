   ============================================================ */
function renderAll() { renderFilters(); renderMain(); renderDetail(); renderSync(); }

function renderSync() {
  const btn = document.getElementById('btn-sync');
  btn.disabled = busy() || !canSync();
  btn.title = canSync() ? '' : NO_SYNC_TITLE;
  const s = syncInfo();
  const label = document.getElementById('sync-label');
  label.className = 'sync-label m-sr' + s.cls;
  label.textContent = s.text;
  // 960px 以下では件数の行（.m-sync）に同じ文を出す（ヘッダーの .sync-label は読み上げ用に見えない形で残る）
  document.querySelectorAll('.m-sync').forEach((m) => { m.className = 'm-sync' + s.cls; m.textContent = s.text; });
}
/* 同期ボタン横の文（最終同期の時刻・同期中・結果のメッセージ）と、色のクラス */
function syncInfo() {
  const last = state.data.syncedAt ? '最終同期 ' + timeShort(state.data.syncedAt) : (state.loading ? '' : '未同期');
  const n = state.notice;
  return {
    cls: n && !busy() && n.kind ? ' ' + n.kind : '',
    text: state.syncing ? '同期中…（数分かかることがあります）' : state.resyncing ? '読み直し中…' : (n ? n.text + (last ? '　' + last : '') : last)
  };
}
/* 件数の行に出す同期の文（960px 以下だけ見える。読み上げはヘッダーの .sync-label が担うので aria-hidden） */
const mSyncHTML = () => { const s = syncInfo(); return `<span class="m-sync${s.cls}" aria-hidden="true">${esc(s.text)}</span>`; };

function renderFilters() { keepFocus(renderFiltersBody); }
function renderFiltersBody() {
  const items = state.data.items;
  const el = document.getElementById('filters');
  el.classList.toggle('closed', !state.filtersOpen);
  const n = activeFilters().length;
  const badge = document.getElementById('rail-badge');
  badge.hidden = n === 0; badge.textContent = n;
  // 960px 以下の「絞り込み」ボタンのバッジ。キーワードは検索欄に見えているので数えない（シートの中の条件の数）
  const nSheet = activeFilters().filter((a) => a.key !== 'q').length;
  const mBtn = document.getElementById('m-filter-btn'), mBadge = document.getElementById('m-filter-badge');
  mBadge.hidden = nSheet === 0; mBadge.textContent = nSheet;
  mBtn.setAttribute('aria-label', nSheet ? `絞り込み（${nSheet}件の条件で絞り込み中）` : '絞り込み');
  // シートの下の行：「n件を表示」で閉じる、「解除」でシートの中の条件（状態・タグ・作った人）を外す
  const shown = items.filter((it) => matches(it, null)).length;
  document.getElementById('f-sheet-foot').innerHTML = `
    <button class="btn" type="button" data-action="clear-sheet">解除</button>
    <button class="btn btn-primary" type="button" data-action="close-filter-sheet">${shown}件を表示</button>`;

  const statusRows = [['all', 'すべて', '#FFFFFF', '#1F252B']].concat(statusList().map((s) => [s, s, `var(--st-${ST_KEY[s] || 'oth'}-bg)`, `var(--st-${ST_KEY[s] || 'oth'}-bd)`]))
    .map(([k, label, bg, bd]) => {
      const count = items.filter((it) => matches(it, 'status') && (k === 'all' || it.status === k)).length;
      return `<button class="status-row" type="button" data-status="${esc(k)}" aria-pressed="${state.status === k}"><span class="sw" style="background:${bg};border-color:${bd}"></span><span class="label">${esc(label)}</span><span class="count">${count}</span></button>`;
    }).join('');

  const tags = [];
  items.forEach((it) => it.tags.forEach((t) => { if (!tags.includes(t)) tags.push(t); }));
  const tagChips = tags.map((t) => {
    const count = items.filter((it) => matches(it, 'tag') && it.tags.includes(t)).length;
    return `<button class="chip" type="button" data-tag="${esc(t)}" aria-pressed="${state.tag === t}">${esc(t)} <span class="count">${count}</span></button>`;
  }).join('');

  const authors = [];
  items.forEach((it) => { if (!authors.includes(it.author)) authors.push(it.author); });
  const authorChips = ['all'].concat(authors).map((a) =>
    `<button class="chip dark" type="button" data-author="${esc(a)}" aria-pressed="${state.author === a}">${a === 'all' ? '全員' : esc(a)}</button>`).join('');

  document.getElementById('filter-groups').innerHTML = `
    <div class="f-group" role="group" aria-label="状態"><span class="f-label">状態</span><div style="display:flex;flex-direction:column;gap:4px">${statusRows}</div></div>
    <div class="f-group" role="group" aria-label="タグ"><span class="f-label">タグ</span><div class="chips">${tagChips || '<span class="small">まだありません</span>'}</div></div>
    <div class="f-group" role="group" aria-label="作った人"><span class="f-label">作った人</span><div class="chips">${authorChips}</div></div>`;
}

/* カード・行のボタンの読み上げ用の id。名前を aria-labelledby、用途・状態・日付を aria-describedby に
   向けて、中のタグなどを全部読み上げないようにする。id はフォルダIDから作る（英数字と - _ だけにする） */
function ariaIds(prefix, it) {
  const base = prefix + '-' + String(it.folderId || itemSeed(it)).replace(/[^\w-]/g, '_');
  const a = { name: base + '-nm', pp: base + '-pp', st: base + '-st', dt: base + '-dt' };
  a.desc = [it.purpose ? a.pp : '', a.st, a.dt].filter(Boolean).join(' ');
  return a;
}
function renderMain() { keepFocus(renderMainBody); watchThumbs(); }

/* ============================================================

/* ============================================================
   重なり（作品を追加するパネル・960px 以下の絞り込みのシートと詳細）
   開いている重なりは state.layer の1つだけ（null・'guide'・'sheet'・'detail'）。別の重なりを開くと、前のものは閉じる。
   960px 以下で開いている間は、後ろ（ヘッダー・検索の行・一覧）を inert にし、ページのスクロールを止める。
   ページ全体がスクロールする幅なので、body を position:fixed にして今の位置で止め、閉じたら同じ位置に戻す
   （後ろの一覧は開いている間も動かない。閉じたあとのスクロール位置も変わらない）。
   PC（961px 以上）で見た目に出るのは作品を追加するパネルだけ（今までどおり）。'sheet'・'detail' は、幅を広げても
   state.layer に残す（狭く戻すとまた重なる。履歴の段と食い違わないように）。PC では見えず、何も止めない

/* 重なりを dialog にする（PC・閉じているときは外す）。label は外したときに戻す aria-label */
function setDialog(el, on, labelId, label) {

    el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', labelId);
    el.removeAttribute('aria-label');

/* state.layer と幅から、作品を追加するパネルの表示・見た目のクラス・dialog・inert・スクロールの停止を決める。

  const narrow = narrowMq.matches;

  document.getElementById('sheet').hidden = !guide;
  document.getElementById('add').hidden = !add;
  document.body.classList.toggle('detail-open', det);
  document.body.classList.toggle('fsheet-open', fs);
  setDialog(document.getElementById('detail'), det, 'detail-title', '作品の詳細');
  setDialog(document.getElementById('f-sheet'), fs, 'f-sheet-title', null);
  document.getElementById('m-filter-btn').setAttribute('aria-expanded', fs);
  // 後ろにするもの。作品を追加するパネルは .app の外なので .app ごと。シートは #filters の中なので、検索の行の部品だけ
  const back = add || (narrow && guide) ? ['.app'] : det ? ['.topbar', '#filters', '#main'] : fs ? ['.topbar', '#main', '#detail', '.f-search', '#m-filter-btn'] : [];
  document.querySelectorAll('.app, .topbar, #filters, #main, #detail, .f-search, #m-filter-btn').forEach((el) => {

const cardOf = (id) => id ? document.querySelector(`#main [data-select="${CSS.escape(id)}"]`) : null;

let lastFocus = null;   // 作品を追加するパネルを閉じたときに戻す先
function openLayer(kind, id, fromHistory) {

    const body = document.getElementById('sheet-body');
    if (!body.childElementCount) { body.appendChild(document.getElementById('guide-template').content.cloneNode(true)); fillGuideLinks(); }
    applyGuideWay();
    // メニューから開いたときは、閉じたら ▾ に戻す（メニューの項目は隠れている）
    if (!was) lastFocus = document.activeElement && document.activeElement.closest('#add-menu') ? document.getElementById('btn-add-menu') : document.activeElement;
  }

  state.layer = null;

  if (!narrow && kind !== 'guide' && kind !== 'add') { if (!fromHistory) recordClose(kind); return; }   // PC では見えていなかった

/* カードが画面（960px 以下は上に固定した2行の下）から外れていれば、見える位置までスクロールする。

/* ============================================================
   履歴（端末の「戻る」で重なりを閉じる。M4・M7）
   GAS の画面は sandbox の iframe の中なので、window.history ではなく google.script.history を使う。
     push(state, params, hash) / replace(state, params, hash)：params は URL の ? 以降（null なら今のまま、{} なら消える）
     setChangeHandler(fn)：「戻る」「進む」で fn({ state, location: { parameter, parameters, hash } }) が呼ばれる
   最初の ?item= は google.script.url.getLocation(fn) で読む。プレビューでは build.mjs が history の偽物を入れる。
   決まり（状態は histLayer の1つの値：今の段に積んでいる重なり。null なら積んでいない＝一覧の段）：
   - 段は一覧の段の上に高々1つ。state は { overlay: 'detail', item } / { overlay: 'sheet' } / { overlay: 'guide' } / { overlay: 'add' }。
     詳細の段だけ URL を ?item=<フォルダID> にする
   - 960px 以下で重なりを開く：積んでいなければ push、積んでいれば replace（載せ替え。何段も積むと、
     一覧に戻るまで「戻る」を何回も押すことになるため）
   - PC（961px 以上）では push しない。作品を選ぶと replace で ?item= だけ替える（その URL を写せば同じ作品が開く。
     選ぶたびに履歴が増えると「戻る」が煩わしいため）。段を積んだまま広げたときは、その段の state のまま replace する
   - 「×」「← 一覧」・Esc で閉じる：積んでいれば history.back() で段を消す（積んだままだと、次の「戻る」が
     見た目の変わらない空振りになる）。BACK_WAIT_MS 待っても返事（履歴の変化）が来なければ、back() が効かなかったとみて、
     今の段を replace で一覧の段に書き換える（空振りは1回で済む）。返事待ちの間に開いた重なりは、返事が来てから push する。

   - 「戻る」「進む」（setChangeHandler）：来た段の state.overlay の重なりを開く。overlay が無い段なら、
     積んでいたときだけ閉じる（積んでいない重なり＝返事待ちの間に開いたものは、遅れて来た返事で閉じない）
   - ?item= のリンクで 960px 以下に開いたとき：今の段を replace で一覧の段（?item= なし）にしてから詳細を push する。
     「戻る」1回目で一覧、2回目でアプリの外。一覧に無い ID なら replace で ?item= を外す。PC は選ぶだけ（URL はそのまま）
   - USE_HISTORY_PUSH を false にすると push しない（GAS の iframe で back() が効かないと分かったとき用。
     「戻る」で閉じる機能は無くなり、URL の ?item= を replace で替えるだけになる）
   ============================================================ */
const USE_HISTORY_PUSH = true;
const BACK_WAIT_MS = 600;   // back() の返事をこれだけ待つ
const gsHistory = () => (window.google && google.script && google.script.history) || null;

let backWait = null;        // back() の返事待ち：{ timer, pending（返事待ちの間に開いた重なり。無ければ null） }
/* 重なり kind の段の state と URL の ? 以降（null は今のまま） */
const entryOf = (kind) => kind === 'detail' ? [{ overlay: 'detail', item: state.selId }, { item: state.selId }] : [{ overlay: kind }, null];
function recordOpen(kind) {
  const h = gsHistory();
  if (!h) return;

  if (histLayer) { h.replace(st, params); histLayer = kind; return; }                  // 載せ替え
  if (!USE_HISTORY_PUSH || !narrowMq.matches) { if (params) h.replace(null, params); return; }   // URL だけ
  if (backWait) { backWait.pending = kind; return; }                                  // 返事が来てから
  h.push(st, params); histLayer = kind;
}

  histLayer = null;

  w.timer = setTimeout(() => {   // 返事が来ない：back() が効かなかったとみて、今の段を一覧の段にする
    if (backWait === w) { backWait = null; h.replace(null, {}); }

/* PC で作品を選んだ。積んでいる段があれば、その state のまま ?item= を替える */
function recordSelect(id) {

function onHistoryChange(e) {

  let kind = st && st.overlay;
  if (kind === 'detail' && !hasItem(st.item)) kind = null;
  if (kind !== 'detail' && kind !== 'sheet' && kind !== 'guide' && kind !== 'add') kind = null;
  const had = histLayer;
  histLayer = kind;
  if (kind) openLayer(kind, st.item, true);

}

/* M7：URL の ?item=<フォルダID> で開いたときの作品。google.script.url.getLocation は非同期なので、

const start = { loc: false, item: '', done: false };
function readStartLocation() {
  const u = window.google && google.script && google.script.url;

  if (!hasItem(id)) { if (h) h.replace(null, {}); return; }
  if (narrowMq.matches) {
    if (h && USE_HISTORY_PUSH) h.replace(null, {});   // 今の段を一覧の段にしてから、詳細を積む
    openLayer('detail', id, false);
    return;
  }

  const card = cardOf(id);
  if (card) revealCard(card);
}

/* 幅が 960px をまたいだとき。state.layer は残す（PC では見えない。狭く戻すとまた重なる）。
   スクロールの枠も変わるので、画像の見張りをやり直す。消える部品にあったフォーカスは移す */
function onNarrowChange() {
  const narrow = narrowMq.matches;
  closeAddMenu(false);
  if (!narrow && !state.loading) selectFirstOnPc();
  applyLayers();

  const a = document.activeElement;
  if (a && a !== document.body && a.offsetParent !== null) return;
  const layerEl = state.layer === 'add' ? document.getElementById('add-close') : narrow && state.layer && state.layer !== 'guide'
    ? document.getElementById(state.layer === 'sheet' ? 'f-sheet-close' : 'detail-back') : null;

/* ============================================================

     もう一度開くと「保存していない変更があります（続ける／捨てる）」を出す（確かめのダイアログで「戻る」と争わないため）

const callServer = (name, ...args) => new Promise((ok, ng) => { google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[name](...args); });

const itemById = (id) => state.data.items.find((x) => x.folderId === id) || null;

let forceDetail = false;      // true なら、編集中でも詳細を描き直す（renderDetailBody）
const fieldsOf = (src) => ({ author: src.author || '', purpose: src.purpose || '', status: src.status || '', tags: (src.tags || []).slice(), note: (src.note || []).slice() });

function newEditor(scope, id, src, fp) {
  return { scope, id, base: fieldsOf(src), fields: fieldsOf(src), fp: fp || '', tagInput: '', error: '', errors: {}, saving: false, uploads: [], busyFile: null, broken: null, overwrite: false, clashes: [], merged: [] };
}
const FIELD_NAMES = { author: '作った人', purpose: '用途', status: '状態', tags: 'タグ', note: 'メモ' };
/* 並び（タグ・メモの行）の三方向の合わせ：相手の最新から自分が消したものを消し、自分が足したものを足す。
   足したものは、自分の並びで直前にある行（と、相手がそのあとに足した行）のあとに置く（その場で直したメモの行が末尾へ動かないように） */
function mergeList(base, mine, theirs) {
  const out = theirs.filter((x) => !(base.includes(x) && !mine.includes(x)));
  mine.forEach((x, i) => {
    if (base.includes(x) || out.includes(x)) return;
    let at = 0;
    for (let j = i - 1; j >= 0; j--) { const k = out.indexOf(mine[j]); if (k >= 0) { at = k + 1; break; } }
    while (at < out.length && !base.includes(out[at]) && !mine.includes(out[at])) at++;   // 相手がそこに足した分のあとへ
    out.splice(at, 0, x);
  });
  return out;
}
/* 箱の土台を、サーバーが返した最新（entry）に替える。保存の競合（conflict）と、自分のファイル操作のあと
   （ほかの人の変更が入っているかもしれない）で使う。比べるのは整えた値（cleanFields。末尾の空白などで食い違わないように）。
   - 自分が変えていない項目は最新の値に
   - タグ・メモを両方が変えていたら合わせる（相手が足した B と自分が足した C の両方が残る）。ed.merged に入れて知らせる
   - 作った人・用途・状態を両方が別の値に変えていたら自分の値のまま、ed.clashes に入れて知らせる
   値が変わった項目があれば true */
function rebase(ed, entry) {
  ed.clashes = []; ed.merged = [];
  const cur = entry && (entry.item || (entry.issue && Object.assign({ fp: entry.issue.fp }, entry.issue.meta)));
  if (!cur) return false;
  const nb = cleanFields(fieldsOf(cur));
  const mine = cleanFields(ed.fields), base = cleanFields(ed.base);
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  let changed = false;
  Object.keys(nb).forEach((k) => {
    let next;
    if (same(mine[k], base[k])) next = nb[k];
    else if (same(nb[k], base[k]) || same(mine[k], nb[k])) return;   // 自分だけが変えた（入力はそのまま）
    else if (Array.isArray(nb[k])) { next = mergeList(base[k], mine[k], nb[k]); ed.merged.push(k); }
    else { ed.clashes.push(k); return; }
    if (!same(next, ed.fields[k])) { ed.fields[k] = JSON.parse(JSON.stringify(next)); changed = true; }
  });
  ed.base = nb;
  ed.fp = cur.fp || '';
  return changed;
}
/* rebase のあとの知らせ（何を合わせたか・どこがぶつかったか） */
function rebaseNote(ed) {
  const names = (ks) => ks.map((k) => FIELD_NAMES[k]).join('・');
  return (ed.merged.length ? names(ed.merged) + 'は、相手とあなたの変更を合わせました（並びも確かめてください）。' : '')
    + (ed.clashes.length ? names(ed.clashes) + 'は両方が変えていたので、あなたの値のままです（保存するとあなたの値になります）。' : '');
}
const isDirty = (ed) => !!ed && (JSON.stringify(cleanFields(ed.fields)) !== JSON.stringify(cleanFields(ed.base)) || !!ed.tagInput.trim());
const uploading = (ed) => !!ed && ed.uploads.some((u) => u.status === 'wait' || u.status === 'send');
const edFor = (el) => el.closest('#issue-dlg') ? state.issueEdit : el.closest('#add') ? selGroup() : el.closest('#detail') ? state.edit : null;
/* 編集の箱を描いている枠（詳細・要対応のダイアログ・作品を追加する画面） */
const boxOf = (ed) => document.getElementById(ed.scope === 'issue' ? 'issue-dlg' : ed.scope === 'add' ? 'add' : 'detail');
/* 入力の検査（サーバーの checkMeta と同じ決まり。正はサーバー） */
function validate(ed) {
  const f = cleanFields(ed.fields), e = {};
  const valid = state.data.statuses && state.data.statuses.length ? state.data.statuses : DEFAULT_STATUSES;
  if (!f.purpose) e.purpose = '何のための部品かを一行で書いてください';
  if (!f.status) e.status = '状態を選んでください';
  else if (!valid.includes(f.status)) e.status = valid.join('・') + ' のどれかを選んでください';
  if (!f.author) e.author = '作った人を書いてください';
  return e;
}
/* サーバーが返した1件（{item} か {issue}）で、一覧の中のその作品を差し替える */
function applyEntry(id, entry) {
  state.data.items = state.data.items.filter((x) => x.folderId !== id);
  state.data.issues = (state.data.issues || []).filter((x) => x.folderId !== id);
  if (entry && entry.item) state.data.items.push(entry.item);
  if (entry && entry.issue) state.data.issues.push(entry.issue);
}
/* 候補：既にあるタグ（多い順。入力中ならその文字を含むもの）と、作った人 */
function tagSuggestions(ed) {
  const count = new Map();
  state.data.items.forEach((it) => it.tags.forEach((x) => count.set(x, (count.get(x) || 0) + 1)));
  const q = ed.tagInput.trim().toLowerCase();
  return [...count.entries()].filter(([x]) => !ed.fields.tags.includes(x) && (!q || x.toLowerCase().includes(q)))
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ja')).slice(0, q ? 12 : 8).map(([x]) => x);
}
function authorSuggestions(ed) {
  const count = new Map();
  state.data.items.forEach((it) => { if (it.author) count.set(it.author, (count.get(it.author) || 0) + 1); });
  const q = ed.fields.author.trim();
  return [...count.entries()].filter(([a]) => a !== q && (!q || a.includes(q))).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([a]) => a);
}
const suggTagsHTML = (ed) => { const l = tagSuggestions(ed); return l.length ? `<span>${ed.tagInput.trim() ? '合うタグ' : 'よく使うタグ'}</span>` + l.map((x) => `<button type="button" data-ed-tag-add="${esc(x)}">#${esc(x)}</button>`).join('') : ''; };
const suggAuthorsHTML = (ed) => { const l = authorSuggestions(ed); return l.length ? '<span>候補</span>' + l.map((a) => `<button type="button" data-ed-author="${esc(a)}">${esc(a)}</button>`).join('') : ''; };

/* 編集のフォーム（用途・状態・タグ・メモ・作った人。一覧の詳細と同じ並び） */

  return `

    <div class="ed-field"><label class="ed-label" for="${p}-purpose">用途 <span class="req req-must">必須</span></label>
      <input class="ed-input" id="${p}-purpose" data-ed="purpose" value="${esc(f.purpose)}" placeholder="何のための部品か（一覧に出る一行）" autocomplete="off"${inv('purpose')}>${err('purpose')}</div>
    <div class="ed-field" role="group" aria-labelledby="${p}-status-l"><span class="ed-label" id="${p}-status-l">状態 <span class="req req-must">必須</span></span>
      <div class="ed-status">${statusList().map((s) => `<button type="button" class="ed-st${f.status === s ? ' st-' + stClass(s) : ''}" data-ed-status="${esc(s)}" aria-pressed="${f.status === s}"${er.status ? ` aria-describedby="${p}-status-err"` : ''}>${esc(s)}</button>`).join('')}</div>${err('status')}</div>
    <div class="ed-field"><span class="ed-label" id="${p}-tags-l">タグ</span>
      <div class="ed-tags" data-ed-tags>${f.tags.map((x, i) => `<span class="ed-tag">#${esc(x)}<button type="button" data-ed-tag-del="${i}" aria-label="タグ「${esc(x)}」を外す">${ICON.x}</button></span>`).join('')}<input class="ed-tag-input" id="${p}-tag" data-ed="tagInput" value="${esc(ed.tagInput)}" placeholder="${f.tags.length ? 'さらに足す' : 'タグを足す'}" aria-labelledby="${p}-tags-l" aria-describedby="${p}-tag-hint" autocomplete="off" enterkeyhint="done"></div>
      <div class="ed-sugg" data-sugg="tags">${suggTagsHTML(ed)}</div>

    <div class="ed-field"><span class="ed-label" id="${p}-note-l">メモ</span>
      ${f.note.length ? `<ul class="ed-notes" aria-labelledby="${p}-note-l">${f.note.map((n, i) => `<li><input class="ed-input" data-ed-note="${i}" value="${esc(n)}" aria-label="メモの${i + 1}行目" autocomplete="off" enterkeyhint="next"><button class="icon-btn" type="button" data-ed-note-del="${i}" aria-label="メモの${i + 1}行目を消す">${ICON.trash}</button></li>`).join('')}</ul>` : ''}
      <button class="btn btn-small ed-add" type="button" data-ed-note-add>＋ 行を足す</button>
      <span class="small">1行に1つのこと（必要な部品、印刷のコツ、経緯など）。行の中で Enter を押すと次の行</span></div>
    <div class="ed-field"><label class="ed-label" for="${p}-author">作った人 <span class="req req-must">必須</span></label>
      <input class="ed-input" id="${p}-author" data-ed="author" value="${esc(f.author)}" autocomplete="off"${inv('author')}>${err('author')}
      <div class="ed-sugg" data-sugg="authors">${suggAuthorsHTML(ed)}</div></div>`;
}
const edFootText = (ed) => ed.saving ? (uploading(ed) || ed.refreshing ? 'ファイルを上げ終わるのを待って保存します…' : '保存しています…') : uploading(ed) ? 'ファイルを上げています…' : isDirty(ed) ? '保存していない変更があります' : '変更はまだありません';
function edFootHTML(ed) {
  return `<span class="grow${isDirty(ed) && !ed.saving ? ' dirty' : ''}" data-ed-foot-text aria-live="polite">${edFootText(ed)}</span>
    <button class="btn" type="button" data-action="edit-cancel"${ed.saving ? ' disabled' : ''}>やめる</button>
    <button class="btn btn-primary" type="button" data-action="edit-save"${ed.saving ? ' disabled' : ''} data-ed-save>${isDirty(ed) ? '保存する' : '編集を終える'}</button>`;
}
/* 入力のたびに、下の行の文と保存ボタンの名前だけを直す（フォームは描き直さない） */
function updateFoot(ed) {
  if (ed.scope === 'add') { paintGroup(ed); return; }
  const box = boxOf(ed);
  const text = box.querySelector('[data-ed-foot-text]');
  if (text && ed.scope === 'detail') { text.textContent = edFootText(ed); text.classList.toggle('dirty', isDirty(ed) && !ed.saving); }
  const save = box.querySelector('[data-ed-save]');
  if (save && ed.scope === 'detail') save.textContent = isDirty(ed) ? '保存する' : '編集を終える';
}
function edFilesHTML(it, ed) {
  const mb = Math.round(uploadMax() / 1024 / 1024);

      ? '<span class="small">上の内容</span>'

    ${ed.uploads.some((u) => !(u.applied && !u.error)) ? `<ul class="ed-ups" aria-live="polite">${ed.uploads.map((u, i) => u.applied && !u.error ? '' : `<li class="ed-up is-${u.status}"><span class="fname">${esc(u.name)}</span><span class="st">${upLabel[u.status]}</span>${u.status === 'fail' && u.file ? `<button class="btn btn-small" type="button" data-action="up-retry" data-i="${i}">もう一度</button>` : ''}${u.error ? `<span class="why">${esc(u.error)}</span>` : ''}</li>`).join('')}</ul>` : ''}
    ${ed.uploads.some((u) => u.status === 'fail' && /大きすぎ/.test(u.error || '')) && it.folderUrl ? `<a class="glink" href="${esc(it.folderUrl)}" target="_blank" rel="noopener" style="align-self:flex-start;margin:0">ドライブでこの作品のフォルダを開く</a>` : ''}
    <div class="ed-drop" data-ed-drop>${ICON.upload}<span>ここにファイルを落とすか</span><button class="btn btn-small" type="button" data-action="file-pick">ファイルを選ぶ</button>
      <input type="file" multiple hidden data-ed-file-input>
      <span class="small">落とした・選んだときにすぐ上がります（1ファイル ${mb}MB まで）。同じ名前のファイルは置き換えるか確かめます</span></div>`;

function detailEditHTML(it, ed) {
  return `
    <div class="detail-bar"><button class="detail-back" id="detail-back" type="button" data-action="close-detail" aria-label="一覧に戻る">${ICON.back}<span>一覧</span></button><span class="detail-bar-name" aria-hidden="true">${esc(it.name)}</span></div>
    <div class="detail-head"><span class="ed-mode">${ICON.pen}編集中</span><span class="date">${dateLong(it.date)}作成</span></div>

      <div class="ed" data-editor="detail">${editFormHTML(ed)}</div>

/* 形が変わったときに描き直し、focusSel の要素にフォーカスを置く（末尾にカーソル） */
function rerenderEditor(ed, focusSel) {
  if (ed.scope === 'issue') renderIssueDialog();
  else if (ed.scope === 'add') renderAdd();
  else if (state.edit === ed) { forceDetail = true; renderDetail(); }
  else return;
  const box = boxOf(ed);
  if (ed.saving) box.querySelectorAll('.ed input, .ed button').forEach((x) => { x.disabled = true; });   // 保存中に打った文字は返事で消えるので止める
  if (!focusSel) return;
  const el = box.querySelector(focusSel);
  if (!el) return;
  el.focus();
  if (el.setSelectionRange && typeof el.value === 'string') { const n = el.value.length; try { el.setSelectionRange(n, n); } catch (_) { /* number などは無視 */ } }
}
function renderEdFiles(ed) {
  if (state.edit !== ed) return;
  const box = document.querySelector('#detail [data-ed-files]'), it = itemById(ed.id);
  if (box && it) box.innerHTML = edFilesHTML(it, ed);
  updateFoot(ed);
}
function refreshSugg(ed, kind) {
  const box = boxOf(ed);
  const el = box.querySelector(`[data-sugg="${kind}"]`);
  if (el) el.innerHTML = kind === 'tags' ? suggTagsHTML(ed) : suggAuthorsHTML(ed);
}
/* タグの入力欄の文字をタグにする（読点・カンマで区切って複数も可） */
function commitTagInput(ed) {
  const parts = ed.tagInput.split(/[、,，]/).map((x) => x.trim()).filter(Boolean);
  parts.forEach((x) => { if (!ed.fields.tags.includes(x)) ed.fields.tags.push(x); });
  ed.tagInput = '';
  return parts.length > 0;
}

/* 詳細の編集を始める（下書きがあればそれから） */
function startEdit(id) {
  const it = itemById(id);
  if (!it || !canEdit()) return;
  state.edit = drafts.get(id) || newEditor('detail', id, it, it.fp);
  drafts.delete(id);
  forceDetail = true;
  renderDetail();
  rerenderEditor(state.edit, '#ed-detail-purpose');
}
/* 詳細の編集から抜ける。keepDraft なら、変更があれば下書きに残す（別の作品を選んだ・閉じた） */
function leaveEdit(keepDraft) {
  const ed = state.edit;
  if (!ed) return;
  state.edit = null;
  if (keepDraft && isDirty(ed) && itemById(ed.id)) drafts.set(ed.id, ed);
  forceDetail = true;
}
async function cancelEdit(ed) {
  if (isDirty(ed) && !(await askConfirm({ title: '変更を捨てますか？', text: '保存していない変更は消えます。上げたファイルはそのまま残ります。', ok: '捨てる', cancel: '編集に戻る', danger: true }))) return;
  leaveEdit(false);
  renderDetail();
  focusEditButton();
}
const focusEditButton = () => { const b = document.querySelector('#detail [data-action="edit-start"]'); if (b) b.focus(); };
async function saveEdit(ed) {
  commitTagInput(ed);
  ed.errors = validate(ed);
  if (Object.keys(ed.errors).length) {
    ed.error = '';
    const first = ['purpose', 'status', 'author'].find((k) => ed.errors[k]);
    rerenderEditor(ed, first === 'status' ? '[data-ed-status]' : `#ed-${ed.scope}-${first}`);
    return;
  }
  if (ed.scope === 'detail' && !isDirty(ed)) { leaveEdit(false); renderDetail(); focusEditButton(); return; }
  if (ed.broken !== null && !ed.overwrite) { ed.error = '今の meta.json を捨ててよいか、上のチェックで確かめてください'; rerenderEditor(ed, '[data-ed-overwrite]'); return; }
  ed.saving = true; ed.error = '';
  rerenderEditor(ed);
  // ファイルを上げている途中なら、上げ終えて一覧に反映するのを待ってから送る（待たないと指紋が違って「ほかの人が先に変更」になる）
  while (uploading(ed) || ed.refreshing) await new Promise((r) => setTimeout(r, 300));
  try {
    const r = await callServer('updateItemMeta', ed.id, cleanFields(ed.fields), ed.fp, ed.overwrite);
    ed.saving = false;
    if (r && r.ok) { applyEntry(ed.id, r.entry); finishSave(ed, r.entry); return; }
    if (r && r.conflict) {   // 誰かが先に変えていた：最新を土台にして、入力は残す
      applyEntry(ed.id, r.entry);
      const changed = rebase(ed, r.entry);
      // サーバーの文の代わりに、何を合わせたか・どこがぶつかったかを書く（指紋はファイルも含むので、項目は変わっていないこともある）
      ed.error = !isDirty(ed) ? 'ほかの人が先に同じ内容に変更していました。保存しなくてかまいません'
        : 'ほかの人が先にこの作品を変更していました。'
          + (changed || ed.merged.length ? 'その変更と、あなたの入力を合わせて下に入れました（まだ保存していません）。' : '最新の内容を読み込みました（あなたの入力はそのままです）。')
          + rebaseNote(ed)
          + '内容を確かめてからもう一度保存してください。わかりにくいときは「やめる」で戻り、今の内容を見てから編集し直してください';
    } else if (r && r.broken !== undefined) {
      ed.broken = r.broken; ed.error = r.message;
    } else {
      ed.error = (r && r.message) || '保存できませんでした';
    }
  } catch (err) {
    ed.saving = false;
    ed.error = errMsg(err);
  }
  renderAll();
  rerenderEditor(ed);
}
function finishSave(ed, entry) {
  const it = entry && entry.item;
  if (ed.scope === 'detail') {
    // 返事を待つ間に別の作品を選んだ・閉じたときは、この箱は今の編集ではない（下書きに移っている）
    if (drafts.get(ed.id) === ed) drafts.delete(ed.id);
    const current = state.edit === ed;
    if (current) leaveEdit(false);
    state.notice = { text: '「' + (it ? it.name : '') + '」を保存しました', kind: '' };
    renderAll();
    if (current) focusEditButton();
    return;
  }
  // 要対応を直した：一覧に出たら、ダイアログを閉じてその作品を選ぶ。まだ不備があれば、ダイアログに理由を出す
  if (it) {
    state.issueEdit = null;
    document.getElementById('issue-dlg').close();
    state.notice = { text: '「' + it.name + '」を一覧に出しました', kind: '' };
    if (narrowMq.matches) { renderAll(); openLayer('detail', it.folderId, false); return; }
    state.selId = it.folderId;
    renderAll();
    const card = cardOf(it.folderId);
    if (card) { revealCard(card); card.focus({ preventScroll: true }); }
    return;
  }
  ed.base = fieldsOf(ed.fields);
  ed.fp = entry && entry.issue ? entry.issue.fp : ed.fp;
  ed.error = 'meta.json は保存しましたが、まだ直すところがあります：' + (entry && entry.issue ? entry.issue.problem : '');
  renderAll();
  rerenderEditor(ed);
}

/* ---- ファイルの削除と追加（詳細の編集）---- */
const uploadMax = () => state.data.uploadMaxBytes || 20 * 1024 * 1024;
const UPLOAD_PARALLEL = 2;   // 同時に送る数
const UPLOAD_TRIES = 3;      // 1ファイルを送る回数の上限（思いがけない失敗だけ送り直す）
/* サーバーの cleanUploadName と同じ整え方（同じ名前かを先に調べるため） */
const cleanName = (n) => String(n || '').replace(/[\u0000-\u001f\u007f/\\:*?"<>|]/g, '_').trim().replace(/[.\s]+$/, '');
function fileToBase64(file) {
  return new Promise((ok, ng) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).slice(String(r.result).indexOf(',') + 1));
    r.onerror = () => ng(r.error || new Error('ファイルを読めませんでした'));
    r.readAsDataURL(file);
  });
}
/* 送り直してよい失敗か（サーバーが決まった文で断ったものは、何度送っても同じなので送り直さない） */
const retryable = (err) => { const m = errMsg(err); return /^上げられませんでした：/.test(m) || !/[ぁ-んァ-ン]/.test(m); };
/* 1件を送る。u は { file, name, status, error, ... }、send(u, base64) はサーバーを呼ぶ Promise */
async function sendOne(u, send, onChange) {
  u.status = 'send'; u.error = ''; onChange();
  for (let i = 1; ; i++) {
    try {
      const b64 = await fileToBase64(u.file);
      u.result = await send(u, b64);
      u.status = 'done'; onChange();
      return;
    } catch (err) {
      if (i >= UPLOAD_TRIES || !retryable(err)) { u.status = 'fail'; u.error = errMsg(err); onChange(); return; }
      await new Promise((r) => setTimeout(r, 800 * i));
    }
  }
}
/* list の中の待っているものを、同時に UPLOAD_PARALLEL 本まで送る。全部終わったら解決する */
function runUploads(list, send, onChange) {
  const queue = list.filter((u) => u.status === 'wait');
  // 前に呼んだ分の順番待ちと重なることがあるので、送る直前にまだ待っているかを確かめる（sendOne は最初に send にする）
  const worker = async () => { while (queue.length) { const u = queue.shift(); if (u.status === 'wait') await sendOne(u, send, onChange); } };
  return Promise.all(Array.from({ length: Math.min(UPLOAD_PARALLEL, queue.length) }, worker));
}
async function addFilesToItem(ed, files) {
  const it = itemById(ed.id);
  if (!it || !files.length) return;
  const max = uploadMax(), mb = Math.round(max / 1024 / 1024);
  const names = (it.files || []).map((f) => f.name);
  const ok = [];
  files.forEach((f) => {
    const name = cleanName(f.name);
    if (!name) ed.uploads.push({ name: f.name, status: 'fail', error: 'この名前のファイルは上げられません' });
    else if (name.toLowerCase() === 'meta.json') ed.uploads.push({ name, status: 'fail', error: 'meta.json は上の欄で編集します' });
    else if (f.size > max) ed.uploads.push({ name, status: 'fail', error: `大きすぎます（${mb}MB まで）。ドライブで直接入れてください` });
    else ok.push({ file: f, name, status: 'wait', replace: false });
  });
  const dup = ok.filter((u) => names.includes(u.name));
  if (dup.length) {
    const yes = await askConfirm({ title: '同じ名前のファイルがあります', text: '置き換えると、今のファイルはドライブのゴミ箱に移ります（30日以内なら戻せます）。', list: dup.map((u) => u.name), ok: '置き換える', cancel: 'この分は上げない' });
    dup.forEach((u) => { if (yes) u.replace = true; else { u.status = 'fail'; u.file = null; u.error = '同じ名前のファイルがあるので上げませんでした'; } });
  }
  ok.forEach((u) => ed.uploads.push(u));
  renderEdFiles(ed);
  await uploadToItem(ed);
}
async function uploadToItem(ed) {
  ed.refreshing = (ed.refreshing || 0) + 1;   // 上げ終えて一覧に反映するまでの間（保存はこれを待つ）
  try {
    await runUploads(ed.uploads, (u, b64) => callServer('uploadItemFile', ed.id, u.name, u.file.type || '', b64, !!u.replace), () => renderEdFiles(ed));
    ed.uploads.forEach((u) => { if (u.status === 'done' && u.result && u.result.notReplaced && !u.warned) { u.warned = true; u.error = '同じ名前の古いファイルを消せませんでした（共有ドライブの権限）。ドライブで古い方を消してください'; } });
    if (!ed.uploads.some((u) => u.status === 'done' && !u.applied)) { renderEdFiles(ed); return; }
    const r = await callServer('refreshItem', ed.id);
    ed.uploads.forEach((u) => { if (u.status === 'done') u.applied = true; });
    adoptEntry(ed, r.entry);
  } catch (err) {
    showError('一覧に反映できませんでした：' + errMsg(err));
  } finally {
    ed.refreshing--;
  }
}
/* 自分のファイル操作のあとの1件を取り込む（指紋が進むので、編集の箱の土台も新しくする） */
function adoptEntry(ed, entry) {
  applyEntry(ed.id, entry);
  const changed = rebase(ed, entry);   // fp だけ進めると、ほかの人の変更を黙って上書きしてしまうので、土台ごと新しくする
  // 指紋が進んだので次の保存は競合にならない。ほかの人の変更を合わせた・ぶつかったなら、ここで知らせる
  if (ed.merged.length || ed.clashes.length || changed) ed.error = 'ほかの人がこの作品を変更していたので、その内容を下に入れました。' + rebaseNote(ed) + '確かめてから保存してください';
  renderMain();
  if (state.edit !== ed) { renderDetail(); return; }
  if (changed || ed.error) rerenderEditor(ed); else renderEdFiles(ed);
}
async function deleteFile(ed, fileId, name) {
  if (!(await askConfirm({ title: '「' + name + '」を消しますか？', text: 'ドライブのゴミ箱に移します。30日以内なら、ドライブのゴミ箱から戻せます。', ok: 'ゴミ箱に移す', danger: true }))) return;
  ed.busyFile = fileId; renderEdFiles(ed);
  try {
    const r = await callServer('trashItemFile', ed.id, fileId);
    state.notice = { text: r.message, kind: '' }; renderSync();
    ed.busyFile = null;
    adoptEntry(ed, r.entry);
  } catch (err) {
    ed.busyFile = null; renderEdFiles(ed);
    showError(errMsg(err));
  }
  const next = document.querySelector('#detail [data-action="file-del"]:not([disabled])') || document.querySelector('#detail [data-action="file-pick"]');
  if (next) next.focus();
}

/* ============================================================

   流れ：ファイルを落とす・選ぶ → すぐ置き場（サーバーの beginUpload が items の直下に作る _up_…）へ上げ始める →
   その間に仕分け（どのファイルがどの作品か）と、作品ごとの説明を入れる → 確認 → 登録（registerItems が
   置き場のファイルを作品フォルダへ移し、meta.json を書き、フォルダ名を付けて一覧に出す）。
   - 仕分けは画面の中だけの情報。上げる先は仕分けに関係ないので、上げ終わりを待たずに仕分けできる
   - 落としたときに仕分けの案を作る（autoSort）：フォルダ1つ＝作品1つ（中がフォルダだけなら、その1つずつ）。
     ばらのファイルは、3Dの元データ（f3d・step など）の名前の先頭の語で作品にまとめ、ほかのファイルは同じ語の作品へ。

   - 作品ごとの説明のフォームは、詳細の編集と同じもの（editFormHTML。作品が編集の箱を兼ねる。scope 'add'）
   - 閉じても（×・Esc・戻る）中身は残る（state.add）。ヘッダーの「作品を追加する」に印が付く。捨てるのは「取り消す」だけ
   ============================================================ */
const ADD_SKIP = /^(\.ds_store|thumbs\.db|desktop\.ini)$/i;   // 落としたフォルダの中でも読まないファイル（ほかに . で始まるもの・*.tmp）
const fileKind = (name) => {
  const e = extOf(name);
  if (['f3d', 'f3z', 'step', 'stp', 'iges', 'igs'].includes(e)) return 'design';
  if (['stl', '3mf', 'obj'].includes(e)) return 'model';
  if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'heic', 'heif'].includes(e)) return 'image';
  return 'other';
};
const THUMB_EXTS = ['png', 'jpg', 'jpeg'];   // 代表画像（thumb.<拡張子>）にできる形式（Code.gs の THUMB_FILE_NAMES）
const LAST_AUTHOR_KEY = 'gallery.lastAuthor';  // 前回入れた「作った人」（この端末だけ）
const lsGet = (k) => { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } };

let addSeq = 0;
function addState() {
  if (!state.add) state.add = { stagingId: '', staging: null, files: [], groups: [], sel: null, step: 'sort', picked: new Set(), busy: false };
  return state.add;
}
const liveFiles = () => (state.add ? state.add.files.filter((f) => !f.removed) : []);
const filesOf = (gid) => liveFiles().filter((f) => f.group === gid);
const groupById = (gid) => (state.add ? state.add.groups.find((g) => g.id === gid) : null) || null;
const selGroup = () => (state.add ? groupById(state.add.sel) : null);
/* 閉じても残っている中身があるか（ヘッダーの印・ページを離れるときの確かめ） */
const addPending = () => !!state.add && state.add.step !== 'done' && (liveFiles().length > 0 || state.add.groups.length > 0);
const stemOf = (n) => String(n).replace(/\.[^.]*$/, '');
const tokenOf = (n) => stemOf(n).split(/[_\-\s.]+/).find(Boolean) || stemOf(n);

const parseDirName = (n) => { const m = /^(\d{4})(\d{2})(\d{2})_(.+)$/.exec(n); return m ? { date: `${m[1]}-${m[2]}-${m[3]}`, name: m[4] } : null; };

const cleanLabel = (n) => String(n || '').replace(/[\u0000-\u001f\u007f/\\:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 80).trim();

/* 作品の日付の案：3Dデータ（無ければ全部）のファイルの更新日のうち古いもの */

  const imgs = filesOf(g.id).filter((f) => fileKind(f.name) === 'image');
  if (!imgs.some((f) => f.role === 'thumb')) {
    const t = imgs.find((f) => f.role === null && /^thumb\.(png|jpe?g)$/i.test(f.name))
      || imgs.find((f) => f.role === null && THUMB_EXTS.includes(extOf(f.name)) && !/^photo_/i.test(f.name));
    if (t) t.role = 'thumb';
  }
  imgs.forEach((f) => { if (f.role === null) f.role = 'photo'; });
}
/* 登録するときの名前（代表画像は thumb.<拡張子>、写真は photo_ を付ける） */
function finalName(f) {
  if (f.role === 'thumb' && THUMB_EXTS.includes(extOf(f.name))) return 'thumb.' + extOf(f.name);
  if (f.role === 'photo' && !/^photo_/i.test(f.name)) return 'photo_' + f.name;
  return f.name;
}
/* 落としたフォルダにあった meta.json を作品の説明に入れる（説明のキー以外の fusion_id などは、登録のときに引き継ぐ） */
async function applyMetaFile(g, file) {
  try {
    const obj = JSON.parse((await file.text()).replace(/^\uFEFF/, ''));
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('not object');
    const s = (v) => (typeof v === 'string' ? v : '');
    const list = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === 'string') : typeof v === 'string' ? v.split(/\r?\n/) : []);
    g.fields = { author: s(obj.author) || g.fields.author, purpose: s(obj.purpose), status: s(obj.status) || g.fields.status, tags: list(obj.tags), note: list(obj.note) };
    g.extraMeta = {};
    Object.keys(obj).forEach((k) => { if (!['author', 'purpose', 'status', 'tags', 'note'].includes(k)) g.extraMeta[k] = obj[k]; });
    g.fromMeta = true;
  } catch (_) {
    g.error = 'フォルダの meta.json を読めなかったので、空欄から書いてください';
  }
}

/* ---- 落とした・選んだファイルを受け取る ---- */
/* ドロップの中身 → [{ file, path }]。path はフォルダからのパス（ばらのファイルは名前だけ）。
   webkitGetAsEntry は drop の処理の中で呼ばないと読めなくなるので、ここ（同期の部分）で取り出す */
function filesFromDrop(dt) {
  const entries = [...(dt.items || [])].filter((i) => i.kind === 'file').map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null));
  if (!entries.length || entries.some((e) => !e)) return Promise.resolve([...dt.files].map((file) => ({ file, path: file.name })));
  const readAll = (dir) => new Promise((ok, ng) => {
    const r = dir.createReader(), out = [];
    const step = () => r.readEntries((es) => { if (!es.length) ok(out); else { out.push(...es); step(); } }, ng);   // 1回に100件までしか返らないので空になるまで
    step();
  });
  const walk = async (e) => {
    if (e.isFile) return [{ file: await new Promise((ok, ng) => e.file(ok, ng)), path: e.fullPath.replace(/^\//, '') }];
    const out = [];
    for (const k of await readAll(e)) out.push(...await walk(k));
    return out;
  };
  return Promise.all(entries.map(walk)).then((ls) => ls.flat());
}
const filesFromInput = (input) => [...input.files].map((file) => ({ file, path: file.webkitRelativePath || file.name }));
/* 受け取ったファイルを仕分けの案つきで加える。target：作品のID（そこへ入れる）・'__new'（新しい作品へ）・null（案を作る） */
async function ingest(list, target) {
  const A = addState();
  list = list.filter((x) => x.file && !ADD_SKIP.test(x.file.name) && !/^\./.test(x.file.name) && !/\.tmp$/i.test(x.file.name));
  if (!list.length) return;
  if (A.busy) { showError('登録の途中です。終わってから足してください'); return; }
  if (A.step === 'done') { resetAdd(); return ingest(list, target); }
  A.step = 'sort';
  const touched = new Set();
  const metaOf = (xs) => xs.find((x) => x.file.name.toLowerCase() === 'meta.json');
  if (target) {
    const g = target === '__new' ? newGroup(tokenOf(list[0].file.name), '', 'manual') : groupById(target);
    const meta = metaOf(list);
    if (meta && !g.fromMeta) await applyMetaFile(g, meta.file);
    list.filter((x) => x !== meta).forEach((x) => addFileEntry(x.file, g.id));
    touched.add(g);
  } else {
    // フォルダごと：先頭のフォルダ1つ＝作品1つ。中がフォルダだけなら、その中のフォルダ1つずつ
    const byTop = new Map(), loose = [];
    list.forEach((x) => {
      const parts = String(x.path || '').split('/').filter(Boolean);
      if (parts.length >= 2) { if (!byTop.has(parts[0])) byTop.set(parts[0], []); byTop.get(parts[0]).push({ ...x, parts }); } else loose.push(x);
    });
    for (const [top, xs] of byTop) {
      const onlyDirs = !xs.some((x) => x.parts.length === 2);
      const byDir = new Map();
      xs.forEach((x) => { const k = onlyDirs ? x.parts[1] : top; if (!byDir.has(k)) byDir.set(k, []); byDir.get(k).push(x); });
      for (const [dir, ys] of byDir) {
        const parsed = parseDirName(dir);
        const g = newGroup(parsed ? parsed.name : dir, parsed ? parsed.date : '', 'folder');
        const meta = ys.find((y) => y.file.name.toLowerCase() === 'meta.json' && y.parts.length === (onlyDirs ? 3 : 2));
        if (meta) await applyMetaFile(g, meta.file);
        ys.filter((y) => y !== meta && y.file.name.toLowerCase() !== 'meta.json').forEach((y) => addFileEntry(y.file, g.id));
        if (!parsed) g.date = guessDate(g);
        touched.add(g);
      }
    }
    if (loose.length) placeLoose(loose, touched);
  }
  touched.forEach((g) => { if (!g.date) g.date = guessDate(g); autoRoles(g); });
  if (!selGroup() && A.groups.length) A.sel = A.groups[0].id;
  renderAdd();
  pumpAddUploads();
}
/* ばらのファイルの仕分けの案（上の「流れ」の説明） */
function placeLoose(xs, touched) {
  const A = addState();
  const byToken = new Map();
  A.groups.forEach((g) => { if (g.token) byToken.set(g.token, g); });
  const meta = xs.find((x) => x.file.name.toLowerCase() === 'meta.json');
  xs = xs.filter((x) => x !== meta);
  const design = xs.filter((x) => fileKind(x.file.name) === 'design');
  const created = [];
  design.forEach((x) => {
    const tk = tokenOf(x.file.name).toLowerCase();
    let g = byToken.get(tk);
    if (!g) { g = newGroup(tokenOf(x.file.name), '', 'name'); g.token = tk; byToken.set(tk, g); created.push(g); }
    addFileEntry(x.file, g.id);
    touched.add(g);
  });
  let fallback = null;
  if (created.length === 1) fallback = created[0];
  else if (!design.length && A.groups.length <= 1) {   // 3Dの元データが無い：まとめて1作品（作品が1つあればそこへ）
    fallback = A.groups[0] || newGroup(tokenOf((xs.find((x) => fileKind(x.file.name) === 'model') || xs[0]).file.name), '', 'name');
  }
  xs.filter((x) => !design.includes(x)).forEach((x) => {
    const g = byToken.get(tokenOf(x.file.name).toLowerCase()) || fallback;
    addFileEntry(x.file, g ? g.id : null);
    if (g) touched.add(g);
  });
  if (meta && touched.size === 1) { const g = [...touched][0]; if (!g.fromMeta) applyMetaFile(g, meta.file).then(() => renderAdd()); }
}

/* ---- 置き場へ上げる（落とした順に、同時に UPLOAD_PARALLEL 本まで）---- */
let addRunning = 0;
function ensureStaging() {
  const A = addState();
  if (!A.staging) {
    A.staging = callServer('beginUpload').then((r) => { A.stagingId = r.id; return r.id; }, (err) => { A.staging = null; throw err; });
  }
  return A.staging;
}
function pumpAddUploads() {
  const A = state.add;
  if (!A) return;
  while (addRunning < UPLOAD_PARALLEL) {
    const f = A.files.find((x) => x.status === 'wait' && !x.removed);
    if (!f) break;
    addRunning++;
    sendOne(f, async (u, b64) => callServer('uploadItemFile', await ensureStaging(), u.name, u.type, b64, false), () => paintFile(f)).then(() => {
      addRunning--;
      if (f.status === 'done') f.fileId = f.result.id;
      if (f.removed && f.fileId && A.stagingId) callServer('discardUploadedFile', A.stagingId, f.fileId).catch(() => {});
      paintFile(f); paintAddFoot();
      pumpAddUploads();
    });
  }
  paintAddFoot();
}
/* 読み上げ用の状態（見た目はチップの色で示す。上がったものは何も付けない） */
const upLabel = (f) => ({ wait: '（上げる順番を待っています）', send: '（上げています）', done: '', fail: '' })[f.status];
/* 上げている途中の表示だけを直す（全体を描き直さない。入力の途中でも邪魔しない） */

function moveFiles(keys, to) {
  const A = state.add;
  let g = null;
  if (to === '__new') { const f0 = A.files.find((f) => f.key === keys[0]); g = newGroup(f0 ? tokenOf(f0.name) : '', '', 'manual'); A.sel = g.id; }
  else if (to && to !== '__none') g = groupById(to);
  const from = new Set();
  keys.forEach((k) => {
    const f = A.files.find((x) => x.key === k);
    if (!f) return;
    if (f.group) from.add(f.group);
    f.group = g ? g.id : null;
    if (g && f.role === 'thumb' && filesOf(g.id).some((x) => x !== f && x.role === 'thumb')) f.role = 'photo';
    A.picked.delete(k);

  from.forEach((gid) => {

/* 登録：作品を1つずつ。その作品のファイルを上げ終わるのを待ってから registerItems を呼ぶ */
const waitUploads = (g) => new Promise((ok) => {

async function registerAll() {

  const todo = A.groups.filter((g) => !(g.result && g.result.state === 'ok'));
  todo.forEach((g) => { g.result = { state: 'wait' }; });
  renderAdd();
  for (const g of todo) {
    await waitUploads(g);
    const fs = filesOf(g.id).filter((f) => f.status === 'done' && f.fileId);
    if (!fs.length) { g.result = { state: 'fail', error: '上がったファイルがありません' }; renderAdd(); continue; }
    g.result = { state: 'run' }; renderAdd();
    try {
      const r = await callServer('registerItems', await ensureStaging(), [{ key: g.id, name: g.name, date: g.date, fields: cleanFields(g.fields), extraMeta: g.extraMeta, files: fs.map((f) => ({ id: f.fileId, name: finalName(f) })) }]);
      const x = r.results[0];
      if (x.ok) {

        if (id) applyEntry(id, e);

    } catch (err) {

  A.step = 'done';
  const ok = A.groups.filter((g) => g.result.state === 'ok').length;
  state.notice = { text: ok + ' 件の作品を登録しました', kind: '' }; renderSync();
  if (ok === A.groups.length && A.staging) A.staging.then((id) => callServer('abandonUpload', id)).catch(() => {});   // 置き場（仕分けなかった分）を片付ける
  renderAdd();
  const f = document.querySelector('#add [data-action="add-finish"]');
  if (f && state.layer === 'add') f.focus();
}

  document.querySelectorAll('.way-switch button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.guideWay === state.guideWay));
}
/* 切り替えを押した。読んでいた段（見出しのすぐ下にある段）の見出しが、切り替えの後も同じ位置に来るようにする
   （上の段の長さがやり方で違っても、見ている所がずれないように） */
function setGuideWay(way) {
  if (way === state.guideWay) return;
  const panel = document.querySelector('#sheet .sheet-panel');
  const headBottom = panel.querySelector('.sheet-head').getBoundingClientRect().bottom;
  const anchor = [...panel.querySelectorAll('.sheet-body section')].find((s) => s.getBoundingClientRect().bottom > headBottom + 8);
  const before = anchor ? anchor.getBoundingClientRect().top : 0;
  state.guideWay = way;
  applyGuideWay();
  if (anchor && panel.scrollTop > 0) panel.scrollTop += anchor.getBoundingClientRect().top - before;
}
/* パネルの中のリンク（a[data-link]）に links シートの URL を入れる。登録が無いものは隠す。
   冒頭の #guide-links には、説明書・管理者向け・items フォルダ・その他のリンクを並べる */
function fillGuideLinks() {
  const body = document.getElementById('sheet-body');
  if (!body.childElementCount) return;   // まだ開いていない（開くときにもう一度呼ぶ）
  body.querySelectorAll('a[data-link]').forEach((a) => {
    const l = linkOf(a.dataset.link);
    a.hidden = !l;
    if (l) a.href = l.url;
  });
  const box = document.getElementById('guide-links');
  const list = ['manual', 'admin', 'items'].map(linkOf).concat(otherLinks()).filter(Boolean);
  box.hidden = !list.length;
  box.innerHTML = list.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}${ICON.ext}</a>`).join('');
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a');
  if (!t) return;
  const d = t.dataset;
  if (d.guideWay) { setGuideWay(d.guideWay); return; }
  if (t.closest('#detail, #issue-dlg, #add') && handleEditClick(t, d)) return;
  if (t.closest('#add') && (d.action !== 'open-guide' && addClick(t, d))) return;
  if (d.action === 'open-add') { openAdd(null); return; }
  if (d.action === 'fix-issue') { openIssueEdit(d.id); return; }
  if (d.select) {
    if (state.edit && state.edit.id !== d.select) leaveEdit(true);   // 編集中に別の作品を選んだ：変更は下書きに残す
    if (narrowMq.matches) { openLayer('detail', d.select, false); return; }   // 960px 以下：詳細を重ねて開く
    state.selId = d.select; renderMain(); renderDetail();
    document.getElementById('detail').scrollTop = 0;
    recordSelect(d.select);   // PC は push しない（「履歴」の決まり）
    return;
  }
  if (d.tag !== undefined) {
    const inDetail = !!t.closest('#detail');   // 描き直すと t は外れるので先に調べる
    state.tag = state.tag === d.tag ? null : d.tag; renderFilters(); renderMain(); renderDetail();
    // 960px 以下で重ねた詳細のタグを押したら、絞り込んだ一覧を見せるために詳細を閉じる
    if (state.layer === 'detail' && narrowMq.matches && inDetail) closeLayer(false);
    return;
  }
  if (d.status) { state.status = d.status; renderFilters(); renderMain(); return; }
  if (d.author) { state.author = d.author; renderFilters(); renderMain(); return; }
  if (d.sort) { state.sort = d.sort; renderMain(); return; }
  if (d.view) { state.view = d.view; renderMain(); return; }
  if (d.clear) {
    if (d.clear === 'q') { state.q = ''; document.getElementById('search').value = ''; }
    else state[d.clear] = d.clear === 'tag' ? null : 'all';
    renderFilters(); renderMain(); renderDetail(); return;
  }
  switch (d.action) {
    case 'toggle-filters': state.filtersOpen = !state.filtersOpen; renderFilters(); break;
    case 'reset': Object.assign(state, { q: '', status: 'all', tag: null, author: 'all' }); document.getElementById('search').value = ''; renderFilters(); renderMain(); renderDetail(); break;
    case 'reload': state.loading = true; state.loadError = ''; renderAll(); loadData(); break;
    case 'open-guide': openGuide(d.guide || null); break;
    case 'open-filter-sheet': openLayer('sheet', null, false); break;
    case 'close-guide': case 'close-detail': case 'close-filter-sheet': closeLayer(false); break;
    case 'clear-sheet': Object.assign(state, { status: 'all', tag: null, author: 'all' }); renderFilters(); renderMain(); renderDetail(); break;
    case 'toggle-issues': state.issuesOpen = !state.issuesOpen; renderMain(); break;
    case 'resync': if (state.selId) resyncItem(state.selId); break;
    case 'resync-issue': resyncItem(d.id); break;
    case 'copy-prompt': {
      const text = document.getElementById('ai-prompt').textContent;
      const ok = () => { t.textContent = 'コピーしました'; setTimeout(() => { t.textContent = '文をコピー'; }, 2000); };
      // GAS の iframe では clipboard API が使えない場合があるので、失敗したら選択＋execCommand で代替する
      const fallback = () => {
        const r = document.createRange(); r.selectNodeContents(document.getElementById('ai-prompt'));
        const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        let done = false; try { done = document.execCommand('copy'); } catch (_) { /* 選択だけ残す */ }
        t.textContent = done ? 'コピーしました' : '選択しました（Ctrl+Cでコピー）';
        setTimeout(() => { t.textContent = '文をコピー'; }, 2500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
      break;
    }
  }
});
document.getElementById('btn-add').addEventListener('click', () => openAdd(null));
document.getElementById('btn-sync').addEventListener('click', syncNow);
document.getElementById('search').addEventListener('input', (e) => { state.q = e.target.value; renderFilters(); renderMain(); });
/* 開いている重なり（Esc で閉じる・Tab をその中で回す） */
function topLayer() {
  if (state.layer === 'guide') return { el: document.querySelector('#sheet .sheet-panel'), guide: true };
  if (state.layer === 'add') return { el: document.querySelector('#add .addm-panel') };
  if (!narrowMq.matches || !state.layer) return null;   // PC では詳細・シートは重ならない
  return { el: document.getElementById(state.layer === 'detail' ? 'detail' : 'f-sheet') };
}
document.addEventListener('keydown', (e) => {
  if (document.querySelector('dialog[open]')) return;   // 確かめ・要対応のダイアログ（<dialog> が Esc とフォーカスを受け持つ）
  if (e.isComposing || e.keyCode === 229) return;       // 日本語の変換中の Esc は変換の取り消し
  const layer = topLayer();
  if (!layer) return;
  if (e.key === 'Escape') { closeLayer(false); return; }
  if (e.key === 'Tab') {
    const f = layer.el.querySelectorAll('button:not([hidden]):not([disabled]), a[href], input:not([type="file"]):not([disabled]), select:not([disabled])');
    const vis = [...f].filter((x) => x.offsetParent !== null && getComputedStyle(x).visibility !== 'hidden');   // 隠した要素を除く
    if (!vis.length) return;
    if (e.shiftKey && document.activeElement === vis[0]) { e.preventDefault(); vis[vis.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === vis[vis.length - 1]) { e.preventDefault(); vis[0].focus(); }
  }
});

{ const h = gsHistory(); if (h) h.setChangeHandler(onHistoryChange); }
readStartLocation();   // ?item=（一覧の読み込みと並行して読む）
renderAll();   // まず「読み込み中」を出す
renderAddMenu();   // 追加のメニュー（リンクは読み込み後に足す）
applyLayers();
loadData();
</script>
